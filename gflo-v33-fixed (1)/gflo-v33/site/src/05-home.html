Mount.home = () => {
  bindSearch("hero-q", "hero-sug");
  bindSearch("hd-q", "hd-sug");
  // animated counters
  document.querySelectorAll("[data-count]").forEach(el => {
    const target = parseFloat(el.getAttribute("data-count")); const dec = target % 1 !== 0;
    let cur = 0; const steps = 50; const inc = target / steps;
    const t = setInterval(() => { cur += inc; if (cur >= target){ cur = target; clearInterval(t); } el.textContent = dec ? cur.toFixed(1) : Math.round(cur).toLocaleString("en-IN"); }, 26);
  });
  countdownInto("home-cd");
  const nf = document.getElementById("news-form");
  nf && nf.addEventListener("submit", e => { e.preventDefault(); State.news = true; State.save(); nf.innerHTML = `<p style="font-weight:700">🎉 You're in! Check your inbox for a welcome surprise.</p>`; toast("Subscribed to G-FLO Weekly"); });
};
function countdownInto(id){
  const el = document.getElementById(id); if (!el) return;
  const tick = () => {
    const end = new Date(); end.setHours(24, 0, 0, 0);
    let s = Math.max(0, Math.floor((end - Date.now()) / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    el.innerHTML = [["Hrs", h], ["Min", m], ["Sec", ss]].map(x => `<div class="cell"><b>${String(x[1]).padStart(2, "0")}</b><span>${x[0]}</span></div>`).join("");
  };
  tick(); clearInterval(el._t); el._t = setInterval(tick, 1000);
}
function guideCard(g, i){
  const c = CAT_MAP[g.cat];
  const lvlColor = { Easy: "b-ok", Moderate: "b-best", Pro: "b-deal" }[g.level] || "b-info";
  return `<a class="gcard rv ${i % 4 ? "rv-d" + (i % 4) : ""}" href="#/g/${g.id}">
    <div class="g-art"><span class="badge ${lvlColor} g-lvl">${g.level}</span>${artFor(PT_MAP[c.pts[0]].art, c.hue, g.id, g.title)}</div>
    <div class="body"><span class="cat-ln" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)">${U.esc(c.name)}</span><h3>${U.esc(g.title)}</h3>

}
