<script>
"use strict";
/* ================= SHARED COMPONENT HTML ================= */
function fitsLabel(p){
  const n = (p.brandFor || []).length;
  if (!n) return "";
  if (n === 1){
    const b = BRAND_MAP[p.brandFor[0]];
    const name = b ? b.name : p.brandFor[0];
    return name === "G-FLO" ? "G-FLO original" : "Fits " + U.esc(name);
  }
  return "Fits " + n + " brands";
}
function priceHtml(p, big){
  if (CATALOG_MODE) return "";
  if (p.price === null || p.price === undefined)
    return `<div class="price-ln"><span class="price price-por">${window.POR_LABEL || "Price on request"}</span></div>`;
  const unit = p.unit && p.unit !== "piece" ? `<span class="unit-ln">/ ${U.esc(p.unit)}</span>` : "";
  return `<div class="price-ln"><span class="price">${U.inr(p.price)}</span>${unit}${p.off ? `<span class="mrp">${U.inr(p.mrp)}</span><span class="off">${p.off}% off</span>` : ""}</div>`;
}
function stockHtml(p){
  if (p.stock === 0) return `<span class="stock-ln s-out">Out of stock</span>`;
  if (p.stock <= 5) return `<span class="stock-ln s-low">Only ${p.stock} left</span>`;
  return `<span class="stock-ln s-in">In stock</span>`;
}
function productCard(p, i){
  const wished = State.wish.includes(p.sku), inCmp = State.cmp.includes(p.sku);
  return `<article class="pcard rv ${i != null && i < 4 ? "rv-d" + (i % 4) : ""}">
    <div class="art">${prodArt(p)}
      <div class="flags">${p.off >= 25 && !CATALOG_MODE ? `<span class="badge b-deal">${p.off}% off</span>` : ""}${p.isNew ? `<span class="badge b-new">New</span>` : ""}${p.isBest ? `<span class="badge b-best">★ Bestseller</span>` : ""}</div>
      <div class="acts">
        <button class="pact ${wished ? "on" : ""}" data-act="wish" data-sku="${p.sku}" aria-label="${wished ? "Remove from" : "Add to"} wishlist" aria-pressed="${wished}">${U.icon("heart", "ic-s")}</button>
        <button class="pact" data-act="quick" data-sku="${p.sku}" aria-label="Quick view">${U.icon("eye", "ic-s")}</button>
      </div>
    </div>
    <div class="body">
      <span class="cat-ln">${U.esc(catOf(p).name)} · ${U.esc(ptOf(p).name)}</span>
      <h3><a href="#/p/${p.sku}">${U.esc(p.short)}</a></h3>
      <div class="rt-ln">${U.stars(p.rating)}<span>${p.rating} (${p.reviews})</span></div>
      <div class="rt-ln"><span class="mono mut3">${p.sku}</span></div>
      ${priceHtml(p)}
      <div class="spread">${stockHtml(p)}<span class="sku-ln">${fitsLabel(p)}</span></div>
      <div class="cta"><button class="btn btn-p btn-sm" data-act="add-cart" data-sku="${p.sku}" ${p.stock === 0 ? "disabled" : ""}>${U.icon("cart", "ic-s")} Add</button><button class="btn btn-ghost btn-sm" data-act="buy-now" data-sku="${p.sku}" ${p.stock === 0 ? "disabled" : ""}>Buy</button></div>
    </div>
  </article>`;
}
function skeletonCards(n){
  return Array.from({ length: n }, () => `<div class="sk-card"><div class="sk a"></div><div class="b"><div class="sk" style="height:10px;width:55%"></div><div class="sk" style="height:13px"></div><div class="sk" style="height:13px;width:80%"></div><div class="sk" style="height:18px;width:45%"></div><div class="sk" style="height:34px;border-radius:10px"></div></div></div>`).join("");
}
function sectionHead(kick, title, sub, moreHref, moreLabel){
  return `<div class="sec-head rv"><div><span class="kick">${U.esc(kick)}</span><h2>${title}</h2>${sub ? `<p>${U.esc(sub)}</p>` : ""}</div>${moreHref ? `<a class="see-all" href="${moreHref}">${U.esc(moreLabel || "View all")} ${U.icon("arr-r", "ic-s")}</a>` : ""}</div>`;
}
function railOf(items){ return `<div class="rail">${items.map((p, i) => productCard(p)).join("")}</div>`; }
function emptyState(icon, title, sub, ctaHref, ctaLabel){
  return `<div class="empty"><div class="e-ic">${U.icon(icon)}</div><div><h3 style="margin-bottom:6px">${U.esc(title)}</h3><p class="mut" style="font-size:13.5px">${U.esc(sub)}</p></div>${ctaHref ? `<a class="btn btn-p" href="${ctaHref}">${U.esc(ctaLabel)}</a>` : ""}</div>`;
}
function crumb(items){
  return `<nav class="crumb" aria-label="Breadcrumb"><a href="#/">Home</a>${items.map((it, i) => `<span class="sep">/</span>${it[1] && i < items.length - 1 ? `<a href="${it[1]}">${U.esc(it[0])}</a>` : `<b>${U.esc(it[0])}</b>`}`).join("")}</nav>`;
}
function brandMark(b, size){
  return `<span class="brand-mk" style="width:${size || 52}px;height:${size || 52}px;font-size:${(size || 52) * .38}px;background:linear-gradient(135deg,hsl(${b.hue} 65% 46%),hsl(${(b.hue + 40) % 360} 70% 38%))">${U.esc(b.name[0])}</span>`;

/* ================= SEARCH UI ================= */
function bindSearch(inputId, sugId){
  const inp = document.getElementById(inputId), sug = document.getElementById(sugId);
  if (!inp || !sug || inp.dataset.bound) return;
  inp.dataset.bound = "1";
  let selIdx = -1;
  const close = () => { sug.classList.remove("open"); inp.setAttribute("aria-expanded", "false"); selIdx = -1; };
  const go = q => { if (!q.trim()) return; close(); location.hash = "#/search/" + encodeURIComponent(q.trim()); };
  const render = () => {
    const q = inp.value;
    if (q.trim().length < 2){ close(); return; }
    const { products, cats, brands, pts, intent } = Search.suggest(q);
    const il = AI.intentLabel(intent);
    let html = "";
    if (il) html += `<div class="sug-intent">${U.icon("spark", "ic-s")} <span><b>AI understood:</b> ${U.esc(il)}</span></div>`;
    if (cats.length || brands.length || pts.length){
      html += `<div class="sug-gr"><div class="sug-tt">Collections</div>${cats.map(c => `<a class="sug-it" href="#/c/${c.id}"><span class="si-ic">${U.icon("c-" + c.id, "ic-s")}</span><span><b>${U.esc(c.name)}</b><small>${c.pts.length} part families</small></span></a>`).join("")}${brands.map(b => `<a class="sug-it" href="#/b/${b.id}"><span class="si-ic">${U.icon("store", "ic-s")}</span><span><b>${U.esc(b.name)}</b><small>Brand store</small></span></a>`).join("")}${pts.map(t => `<a class="sug-it" href="#/search/${encodeURIComponent(t.name)}"><span class="si-ic">${U.icon("cog", "ic-s")}</span><span><b>${U.esc(t.name)}</b><small>Across all appliances</small></span></a>`).join("")}</div>`;
    }
    if (products.length){
      html += `<div class="sug-gr"><div class="sug-tt">Parts</div>${products.map(p => `<a class="sug-it" href="#/p/${p.sku}"><span class="si-art">${prodArt(p)}</span><span style="min-width:0"><b>${U.esc(p.short)}</b><small>${catOf(p).name} · ★ ${p.rating}</small></span>${CATALOG_MODE ? "" : `<span class="price">${U.inr(p.price)}</span>`}</a>`).join("")}</div>`;
    }
    html += `<div class="sug-gr"><button class="sug-it" data-go-search="${U.esc(q)}"><span class="si-ic">${U.icon("search", "ic-s")}</span><span><b>Search “${U.esc(q)}”</b><small>See all matching parts</small></span></button></div>`;
    sug.innerHTML = html; sug.classList.add("open"); inp.setAttribute("aria-expanded", "true");
  };
  inp.addEventListener("input", U.debounce(render, 160));
  inp.addEventListener("focus", render);
  inp.addEventListener("keydown", e => {
    const items = [...sug.querySelectorAll(".sug-it")];
    if (e.key === "Enter"){ e.preventDefault(); if (selIdx >= 0 && items[selIdx]){ items[selIdx].click(); } else go(inp.value); }
    if (e.key === "Escape") close();
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      selIdx = U.clamp(selIdx + (e.key === "ArrowDown" ? 1 : -1), 0, items.length - 1);
      items.forEach((it, i) => it.classList.toggle("sel", i === selIdx));
      if (items[selIdx]) items[selIdx].scrollIntoView({ block: "nearest" });
    }
  });
  document.addEventListener("click", e => { if (!inp.closest(".hd-search,.hero-search")?.contains(e.target)) close(); });
  sug.addEventListener("click", e => { const b = e.target.closest("[data-go-search]"); if (b) go(b.getAttribute("data-go-search")); const a = e.target.closest("a"); if (a) close(); });
}

/* ================= VOICE SEARCH ================= */
function startVoice(targetId, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const inp = document.getElementById(targetId);
  if (!SR){
    toast("Voice input isn't available in this preview — try the demo phrase", "info");
    if (inp){ typeInto(inp, "Bajaj mixer grinder coupler under 300"); }
    return;
  }
  try {
    const rec = new SR(); rec.lang = "en-IN"; rec.interimResults = false;
    btn && btn.classList.add("rec");
    toast("Listening… speak your part or model number", "info");
    rec.onresult = e => { const t = e.results[0][0].transcript; if (inp){ inp.value = t; inp.dispatchEvent(new Event("input")); inp.focus(); } };
    rec.onend = () => btn && btn.classList.remove("rec");
    rec.onerror = () => { btn && btn.classList.remove("rec"); toast("Mic unavailable here — typed a demo query instead", "warn"); if (inp) typeInto(inp, "demolition hammer piston"); };
    rec.start();
  } catch(err){ if (inp) typeInto(inp, "ceiling fan capacitor"); }
}
function typeInto(inp, text){
  let i = 0; inp.value = ""; inp.focus();
  const t = setInterval(() => { inp.value = text.slice(0, ++i); inp.dispatchEvent(new Event("input")); if (i >= text.length) clearInterval(t); }, 28);
}

/* ================= ASSISTANT CHAT ================= */
const CHAT_SUGS = ["Find a mixer motor", "Track my order", "Is COD available?", "Fan is running slow", "Return policy"];
function chatInit(){
  const bd = document.getElementById("chat-bd");
  bd.innerHTML = "";
  chatBot("Namaste! I'm the G-FLO assistant 🔧 Tell me your appliance + problem, or paste a model number — I'll find the exact part.");
  document.getElementById("chat-sugs").innerHTML = CHAT_SUGS.map(s => `<button class="chip" data-chat-sug="${U.esc(s)}">${U.esc(s)}</button>`).join("");
  document.getElementById("chat-form").addEventListener("submit", e => {
    e.preventDefault();
    const q = document.getElementById("chat-q");
    if (!q.value.trim()) return;
    chatMe(q.value); chatRespond(q.value); q.value = "";
  });
  document.getElementById("chat-sugs").addEventListener("click", e => {
    const b = e.target.closest("[data-chat-sug]"); if (!b) return;
    chatMe(b.getAttribute("data-chat-sug")); chatRespond(b.getAttribute("data-chat-sug"));
  });
}
function chatMe(t){ const bd = document.getElementById("chat-bd"); bd.insertAdjacentHTML("beforeend", `<div class="msg me">${U.esc(t)}</div>`); bd.scrollTop = bd.scrollHeight; }
function chatBot(html){ const bd = document.getElementById("chat-bd"); bd.insertAdjacentHTML("beforeend", `<div class="msg bot">${html}</div>`); bd.scrollTop = bd.scrollHeight; }
function chatRespond(q){
  const bd = document.getElementById("chat-bd");
  bd.insertAdjacentHTML("beforeend", `<div class="msg bot typing" id="chat-typing"><i></i><i></i><i></i></div>`); bd.scrollTop = bd.scrollHeight;
  setTimeout(() => {
    document.getElementById("chat-typing")?.remove();
    const ql = q.toLowerCase();
    if (/track|order status|where is/.test(ql)){
      chatBot(`I can pull that up. ${State.orders.length ? `Your latest order <b class="mono">${State.orders[0].id}</b> is <b>${["", "confirmed", "packed", "shipped", "out for delivery", "delivered"][State.orders[0].status] || "confirmed"}</b>.` : "You don't have any orders in this demo session yet."} <a href="#/track" style="color:var(--brand2);font-weight:600">Open order tracking →</a>`);
    } else if (/cod|cash on delivery/.test(ql)){
      chatBot(CATALOG_MODE ? "Yes! <b>Cash on Delivery</b> is available in most pincodes — it's confirmed along with your quote. UPI, cards, netbanking and EMI are also supported (demo mode — no real payment)." : "Yes! <b>Cash on Delivery</b> is available on orders up to ₹5,000 in most pincodes. UPI, cards, netbanking and EMI are also supported at checkout (demo mode — no real payment).");
    } else if (/return|refund/.test(ql)){
      chatBot("G-FLO has <b>7-day easy returns</b>: unused parts in original packing get a full refund within 48 hours of pickup. Electrical parts installed incorrectly aren't eligible — check the install guide first, or ask me!");
    } else if (/slow|not working|broken|repair|fix|problem|noise|leak/.test(ql)){
      const res = Search.query(q, 2);
      const g = GUIDES.find(g => ql.includes(g.cat.split("-")[0])) || GUIDES[4];
      chatBot(`Sounds fixable 💪 Here's a matching repair guide: <a href="#/g/${g.id}" style="color:var(--brand2);font-weight:600">${g.title} →</a>${res.items.length ? "<br><br>Parts you'll likely need:" + res.items.map(p => chatCard(p)).join("") : ""}`);
    } else {
      const res = Search.query(q, 3);
      if (res.items.length){
        const il = AI.intentLabel(res.intent);
        chatBot(`${il ? `Got it — <b>${U.esc(il)}</b>.` : "Here's what matches:"}${res.items.map(p => chatCard(p)).join("")}<br><a href="#/search/${encodeURIComponent(q)}" style="color:var(--brand2);font-weight:600">See all results →</a>`);
      } else {
        chatBot(`I couldn't match that directly. Try the <a href="#/finder" style="color:var(--brand2);font-weight:600">AI Part Finder</a> — you can upload a photo of the part or your appliance's model sticker, and I'll identify it.`);
      }
    }
  }, 700 + Math.random() * 500);
}
function chatCard(p){
  return `<a class="mini-p" href="#/p/${p.sku}"><span class="art">${prodArt(p)}</span><span style="min-width:0"><b>${U.esc(p.short)}</b>${CATALOG_MODE ? "" : `<span class="price">${U.inr(p.price)}</span>`} <small style="color:var(--tx3)">★ ${p.rating}</small></span></a>`;
}

/* ================= GLOBAL EVENTS ================= */
function bindGlobal(){
  document.addEventListener("click", e => {
    const act = e.target.closest("[data-act]");
    const mic = e.target.closest("[data-mic]");
    const mcat = e.target.closest("[data-mega-cat]");
    if (mic){ startVoice(mic.getAttribute("data-mic"), mic); return; }
    if (mcat){ megaCat = mcat.getAttribute("data-mega-cat"); buildMega(); return; }
    if (!act){
      if (!e.target.closest(".mega-wr") && !e.target.closest("#mega")) document.querySelectorAll(".mega.open").forEach(m => { m.classList.remove("open"); });
      return;
    }
    const a = act.getAttribute("data-act"), sku = act.getAttribute("data-sku");
    if (a === "close" || e.target.id === "ovl-bg") closeOverlays();
    if (a === "open-cart"){ renderCartDrawer(); openDrawer("cart-drawer"); }
    if (a === "open-mnav") openDrawer("mnav");
    if (a === "mega"){ if (window.matchMedia("(max-width:767px)").matches){ location.hash = "#/categories"; return; } const m = document.getElementById("mega"); const open = m.classList.toggle("open"); act.setAttribute("aria-expanded", open); }
    if (a === "chat"){ const c = document.getElementById("chat"); c.classList.add("open"); c.setAttribute("aria-hidden", "false"); document.getElementById("ovl-bg").classList.add("open"); document.getElementById("chat-q").focus(); }
    if (a === "add-cart") State.addCart(sku, 1);
    if (a === "buy-now"){ State.addCart(sku, 1, true); location.hash = "#/checkout"; }
    if (a === "wish"){ State.toggleWish(sku); refreshActionStates(); if (Router.parse().page === "wishlist") Router.go(); }
    if (a === "cmp"){ State.toggleCmp(sku); refreshActionStates(); }
    if (a === "qty"){ const it = State.inCart(sku); State.setQty(sku, (it ? it.qty : 1) + (+act.getAttribute("data-d"))); renderCartDrawer(); if (["cart", "checkout"].includes(Router.parse().page)) Router.go(); }
    if (a === "rm-cart"){ State.rmCart(sku); renderCartDrawer(); toast("Removed from cart", "info"); if (["cart", "checkout"].includes(Router.parse().page)) Router.go(); }
    if (a === "quick") quickView(sku);
    if (a === "share"){
      const p = DB.prodMap[sku]; const txt = `${p.short} — ${U.inr(p.price)} on G-FLO`;
      if (navigator.share){ navigator.share({ title: txt, text: txt }).catch(() => {}); }
      else if (navigator.clipboard){ navigator.clipboard.writeText(txt + " " + location.href).then(() => toast("Link copied to clipboard")); }
      else toast("Sharing isn't available in this preview", "info");
    }
  });
  document.getElementById("ovl-bg").addEventListener("click", closeOverlays);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlays(); if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); document.getElementById("hd-q").focus(); } });
  window.addEventListener("hashchange", () => Router.go());
}
function refreshActionStates(){
  document.querySelectorAll("[data-act=wish][data-sku]").forEach(b => { const on = State.wish.includes(b.getAttribute("data-sku")); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  document.querySelectorAll("[data-act=cmp][data-sku]").forEach(b => { const on = State.cmp.includes(b.getAttribute("data-sku")); b.classList.toggle("on2", on); b.setAttribute("aria-pressed", on); });
}
function quickView(sku){
  const p = DB.prodMap[sku]; if (!p) return;
  modal(`<div style="display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div style="border-radius:18px;overflow:hidden;background:linear-gradient(150deg,var(--art-bg1),var(--art-bg2))">${prodArt(p)}</div>
    <div><span class="cat-ln" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)">${catOf(p).name} · ${ptOf(p).name}</span>
    <h3 style="margin:8px 0 10px;font-family:var(--ff);font-weight:700">${U.esc(p.short)}</h3>
    <div class="rt-ln">${U.stars(p.rating)}<span>${p.rating} · ${p.reviews} reviews</span></div>
    <div style="margin:12px 0">${priceHtml(p)}</div>
    ${stockHtml(p)}
    <p class="mut" style="font-size:13px;margin:12px 0">Fits: ${U.esc(brandNames(p, 4))}. ${p.compat.length} verified models. ${p.warranty} warranty.</p>
    <div class="row"><button class="btn btn-p" data-act="add-cart" data-sku="${p.sku}" ${p.stock === 0 ? "disabled" : ""}>${U.icon("cart", "ic-s")} Add to cart</button><a class="btn btn-ghost" href="#/p/${p.sku}" onclick="closeOverlays()">Full details</a></div></div>
  </div>`, { title: "Quick view", wide: true });
}
</script>
