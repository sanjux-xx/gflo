<script>
"use strict";
/* ================= AI HUB / FINDER ================= */
const FINDER = { step: 1, cat: null, pt: null, brand: null };
Pages.finder = tab => {
  const t = tab || "wizard";
  return `
  <div class="wrap">
    ${crumb([["Spare Part Finder"]])}
    <div class="hub-hero rv in">
      <span class="badge" style="background:rgba(255,255,255,.2);color:#fff">${U.icon("spark", "ic-s")} G-FLO AI · on-device demo</span>
      <h1 style="font-size:clamp(24px,3.6vw,40px);margin:12px 0 8px">Find the exact part in seconds</h1>
      <p style="opacity:.9;max-width:560px;font-size:14.5px">Answer three quick questions, upload a photo, or scan your appliance's model sticker — G-FLO AI matches it against ${DB.products.length} certified parts.</p>
    </div>
    <div class="hub-tabs" role="tablist">
      ${[["wizard", "spark", "Guided finder"], ["photo", "camera", "Photo ID"], ["ocr", "scan", "Model sticker OCR"], ["voice", "mic", "Voice search"]].map(x => `<a class="hub-tab ${t === x[0] ? "on" : ""}" href="/finder/${x[0]}" role="tab" aria-selected="${t === x[0]}">${U.icon(x[1], "ic-s")} ${x[2]}</a>`).join("")}
    </div>
    <div style="padding-bottom:50px" id="hub-body">${t === "photo" ? finderPhoto() : t === "ocr" ? finderOcr() : t === "voice" ? finderVoice() : finderWizard()}</div>
  </div>`;
};
function finderWizard(){
  return `<div class="wizard">
    <div class="wz-steps" id="wz-steps"></div>
    <div class="card" style="padding:20px" id="wz-result"><div class="empty" style="padding:40px 10px"><div class="e-ic">${U.icon("spark")}</div><h3 style="font-size:16px">Your matches appear here</h3><p class="mut" style="font-size:13px">Complete the steps to see AI-ranked parts with verified fitment.</p></div></div>
  </div>`;
}
function wzRender(){
  const s = FINDER;
  const steps = document.getElementById("wz-steps"); if (!steps) return;
  steps.innerHTML = `
    <div class="wz-step ${s.step === 1 ? "on" : s.cat ? "done" : ""}"><span class="wz-num">${s.cat ? "✓" : "1"}</span><div style="flex:1"><b>Which appliance needs fixing?</b>
      ${s.step === 1 ? `<div class="opt-grid">${CATS.map(c => `<button class="opt-tile ${s.cat === c.id ? "on" : ""}" data-wz-cat="${c.id}">${U.icon("c-" + c.id)}${U.esc(c.name)}</button>`).join("")}</div>` : `<p class="mut" style="font-size:13px;margin-top:4px">${s.cat ? CAT_MAP[s.cat].name : ""} <button class="meta-act" data-wz-goto="1" style="color:var(--brand2)">change</button></p>`}</div></div>
    <div class="wz-step ${s.step === 2 ? "on" : s.pt ? "done" : ""}"><span class="wz-num">${s.pt ? "✓" : "2"}</span><div style="flex:1"><b>Which part is worn out?</b>
      ${s.step === 2 && s.cat ? `<div class="opt-grid">${CAT_MAP[s.cat].pts.map(id => `<button class="opt-tile ${s.pt === id ? "on" : ""}" data-wz-pt="${id}">${U.icon("cog")}${PT_MAP[id].name}</button>`).join("")}<button class="opt-tile" data-wz-pt="any">${U.icon("spark")}Not sure</button></div>` : s.pt ? `<p class="mut" style="font-size:13px;margin-top:4px">${s.pt === "any" ? "Not sure — show everything" : PT_MAP[s.pt].name} <button class="meta-act" data-wz-goto="2" style="color:var(--brand2)">change</button></p>` : `<p class="mut3" style="font-size:12.5px;margin-top:4px">Pick your appliance first</p>`}</div></div>
    <div class="wz-step ${s.step === 3 ? "on" : s.brand ? "done" : ""}"><span class="wz-num">${s.brand ? "✓" : "3"}</span><div style="flex:1"><b>Which brand is your appliance?</b>
      ${s.step === 3 && s.cat ? `<div class="opt-grid">${CAT_MAP[s.cat].brands.map(id => `<button class="opt-tile ${s.brand === id ? "on" : ""}" data-wz-brand="${id}">${brandMark(BRAND_MAP[id], 30)}${BRAND_MAP[id].name}</button>`).join("")}<button class="opt-tile" data-wz-brand="any">${U.icon("grid")}Any / other</button></div>` : s.brand ? `<p class="mut" style="font-size:13px;margin-top:4px">${s.brand === "any" ? "Any brand" : BRAND_MAP[s.brand].name} <button class="meta-act" data-wz-goto="3" style="color:var(--brand2)">change</button></p>` : `<p class="mut3" style="font-size:12.5px;margin-top:4px">Almost there</p>`}</div></div>`;
  const res = document.getElementById("wz-result");
  if (s.cat && s.pt && s.brand){
    const list = DB.products.filter(p => p.cat === s.cat && (s.pt === "any" || p.pt === s.pt) && (s.brand === "any" || p.brandFor.includes(s.brand))).sort((a, b) => b.rating - a.rating).slice(0, 6);
    res.innerHTML = `<div class="row" style="margin-bottom:14px">${U.icon("spark")}<div><b>${list.length ? list.length + " AI-ranked matches" : "No exact match"}</b><div class="mut3" style="font-size:12px">${CAT_MAP[s.cat].name}${s.pt !== "any" ? " · " + PT_MAP[s.pt].name : ""}${s.brand !== "any" ? " · " + BRAND_MAP[s.brand].name : ""}</div></div></div>
      ${list.length ? `<div class="grid-cards" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${list.map(p => productCard(p)).join("")}</div><a class="btn btn-ghost btn-block" style="margin-top:14px" href="/c/${s.cat}${s.pt !== "any" ? "?pt=" + s.pt : ""}">See all in category ${U.icon("arr-r", "ic-s")}</a>` : emptyState("box", "Nothing exact yet", "Try 'Any brand', or chat with the assistant — we restock weekly.", "/c/" + s.cat, "Browse category")}`;
    revealInit(res);
  }
}
function finderPhoto(){
  return `<div class="wizard">
    <div>
      <label class="drop" id="ph-drop" for="ph-file" style="cursor:pointer">${U.icon("upload")}<b>Upload a photo of the part or appliance</b><span class="mut3" style="font-size:12.5px">JPG / PNG · analysed on-device in this demo · nothing leaves your browser</span><input id="ph-file" type="file" accept="image/*" class="hide"></label>
      <div class="card" style="padding:16px;margin-top:14px"><b style="font-size:13.5px">Tips for a confident match</b><ul style="margin-top:9px;display:grid;gap:7px">${["Shoot the part straight-on, in good light", "Include any printed numbers or codes", "For appliances, capture the full front"].map(t => `<li class="row" style="font-size:13px;color:var(--tx2)">${U.icon("check", "ic-s")} ${t}</li>`).join("")}</ul></div>
    </div>
    <div id="ph-result" class="card" style="padding:20px">${emptyState("camera", "AI vision preview", "Upload an image — G-FLO AI identifies the appliance and suggests matching part families.")}</div>
  </div>`;
}
function finderOcr(){
  return `<div class="wizard">
    <div>
      <label class="drop" id="ocr-drop" for="ocr-file" style="cursor:pointer">${U.icon("scan")}<b>Scan the model-number sticker</b><span class="mut3" style="font-size:12.5px">Usually a silver label on the base, back or door frame</span><input id="ocr-file" type="file" accept="image/*" class="hide"></label>
      <div class="card" style="padding:16px;margin-top:14px"><b style="font-size:13.5px">Or type it manually</b>
        <div class="row" style="margin-top:10px"><input class="inp" id="ocr-manual" placeholder="e.g. ${DB.modelList[3].code}" list="ocr-models"><datalist id="ocr-models">${DB.modelList.slice(0, 60).map(m => `<option value="${m.code}">`).join("")}</datalist><button class="btn btn-p" id="ocr-manual-go">Match</button></div>
      </div>
    </div>
    <div id="ocr-result" class="card" style="padding:20px">${emptyState("scan", "OCR model detection", "Upload the sticker photo — we extract the model number and list every part verified for it.")}</div>
  </div>`;
}
function finderVoice(){
  return `<div class="card" style="max-width:560px;margin:0 auto;padding:30px;text-align:center">
    <span class="kick" style="display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand2)">Voice search</span>
    <h3 style="margin:10px 0 6px">Say it like you'd say it to a mechanic</h3>
    <p class="mut" style="font-size:13.5px">“Preethi mixer coupler under 300” · “LG washing machine drain pump” · “ceiling fan chal nahi raha”</p>
    <button class="mic-big" id="voice-big" aria-label="Start voice search">${U.icon("mic")}</button>
    <p class="mut3" style="font-size:12px" id="voice-status">Tap the mic and speak — if the mic is blocked in this preview, a demo phrase is typed for you.</p>
    <div class="hero-search" style="margin:18px auto 0;max-width:460px"><div class="sbox">${U.icon("search")}<input id="voice-q" placeholder="Your words appear here…" aria-label="Voice search text"><button class="btn btn-p" id="voice-go" style="height:40px">Search</button></div><div class="sug" id="voice-sug"></div></div>
  </div>`;
}
Mount.finder = tab => {
  bindSearch("hd-q", "hd-sug");
  const body = document.getElementById("hub-body");
  if (!tab || tab === "wizard"){
    FINDER.step = 1; FINDER.cat = FINDER.pt = FINDER.brand = null; wzRender();
    body.addEventListener("click", e => {
      const c = e.target.closest("[data-wz-cat]"), p = e.target.closest("[data-wz-pt]"), b = e.target.closest("[data-wz-brand]"), g = e.target.closest("[data-wz-goto]");
      if (c){ FINDER.cat = c.getAttribute("data-wz-cat"); FINDER.pt = FINDER.brand = null; FINDER.step = 2; }
      if (p){ FINDER.pt = p.getAttribute("data-wz-pt"); FINDER.brand = null; FINDER.step = 3; }
      if (b){ FINDER.brand = b.getAttribute("data-wz-brand"); FINDER.step = 4; }
      if (g){ FINDER.step = +g.getAttribute("data-wz-goto"); if (FINDER.step === 1){ FINDER.cat = null; } if (FINDER.step <= 2){ FINDER.pt = null; } FINDER.brand = null; }
      if (c || p || b || g) wzRender();
    });
  }
  if (tab === "photo"){
    const file = document.getElementById("ph-file");
    file.addEventListener("change", () => {
      const f = file.files[0]; if (!f) return;
      const url = URL.createObjectURL(f);
      const res = document.getElementById("ph-result");
      res.innerHTML = `<div class="scan-vis" style="margin:0 auto"><img src="${url}" alt="Uploaded appliance photo"><div class="scan-line"></div></div><p class="mut" style="text-align:center;font-size:13px;margin-top:12px">Analysing shapes, text and context…</p>`;
      setTimeout(() => {
        const d = AI.detectFromFile(f.name, f.size);
        const picks = DB.products.filter(p => p.cat === d.cat.id && d.pts.some(t => t.id === p.pt)).sort((a, b) => b.rating - a.rating).slice(0, 4);
        res.innerHTML = `<div class="row" style="gap:12px"><img src="${url}" alt="" style="width:74px;height:74px;object-fit:cover;border-radius:14px;border:1px solid var(--line)"><div><b>Looks like a ${d.cat.name}</b><div class="mut3" style="font-size:12px">Confidence</div><div class="conf-bar" style="width:160px"><i style="width:0"></i></div></div><span class="badge b-ok" style="margin-left:auto">${d.conf}%</span></div>
        <p class="mut" style="font-size:13px;margin:14px 0 10px">Common failure parts for this appliance:</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${d.pts.map(t => `<a class="chip" href="/c/${d.cat.id}?pt=${t.id}">${U.esc(t.name)}</a>`).join("")}</div>
        ${picks.length ? `<p class="mut" style="font-size:13px;margin:16px 0 10px">Top matches:</p><div class="grid-cards" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${picks.map(p => productCard(p)).join("")}</div>` : ""}
        <p class="mut3" style="font-size:11px;margin-top:14px">Demo classifier — production uses a vision model + your catalogue embeddings.</p>`;
        setTimeout(() => { const cb = res.querySelector(".conf-bar i"); if (cb) cb.style.width = d.conf + "%"; }, 60);
        revealInit(res);
      }, 1700);
    });
  }
  if (tab === "ocr"){
    const showModel = (code, imgUrl, conf, serial) => {
      const m = DB.modelList.find(x => x.code === code.toUpperCase()) || null;
      const res = document.getElementById("ocr-result");
      if (!m){ res.innerHTML = emptyState("alert", "Model not in fitment DB yet", "We add models weekly. Chat with support and we'll source parts for it.", "/support", "Contact support"); return; }
      const parts = DB.products.filter(p => p.compat.includes(m.code)).sort((a, b) => b.rating - a.rating);
      res.innerHTML = `${imgUrl ? `<div class="row" style="gap:12px;margin-bottom:12px"><img src="${imgUrl}" alt="" style="width:74px;height:74px;object-fit:cover;border-radius:14px;border:1px solid var(--line)"><div><div class="mut3" style="font-size:11px">EXTRACTED</div><b class="mono" style="font-size:17px">${m.code}</b>${serial ? `<div class="mut3" style="font-size:11px">Serial ${serial}</div>` : ""}</div><span class="badge b-ok" style="margin-left:auto">${conf || 95}% OCR</span></div>` : `<div class="row" style="margin-bottom:12px"><b class="mono" style="font-size:17px">${m.code}</b><span class="badge b-ok">Verified model</span></div>`}
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:14px"><span class="tag">${BRAND_MAP[m.brand].name}</span><span class="tag">${CAT_MAP[m.cat].name}</span><span class="tag">${parts.length} verified parts</span></div>
      ${parts.length ? `<div class="grid-cards" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${parts.slice(0, 6).map(p => productCard(p)).join("")}</div>` : emptyState("box", "No parts mapped yet", "Support can source this — usually within 48 hours.", "/support", "Request part")}`;
      revealInit(res);
    };
    document.getElementById("ocr-file").addEventListener("change", e => {
      const f = e.target.files[0]; if (!f) return;
      const url = URL.createObjectURL(f);
      const res = document.getElementById("ocr-result");
      res.innerHTML = `<div class="scan-vis" style="margin:0 auto"><img src="${url}" alt="Uploaded model sticker"><div class="scan-line"></div></div><p class="mut" style="text-align:center;font-size:13px;margin-top:12px">Reading label text (OCR)…</p>`;
      setTimeout(() => { const o = AI.ocrFromFile(f.name, f.size); showModel(o.model.code, url, o.conf, o.serial); }, 1600);
    });
    document.getElementById("ocr-manual-go").addEventListener("click", () => { const v = document.getElementById("ocr-manual").value.trim(); if (v) showModel(v); });
  }
  if (tab === "voice"){
    bindSearch("voice-q", "voice-sug");
    document.getElementById("voice-big").addEventListener("click", e => startVoice("voice-q", e.currentTarget));
    document.getElementById("voice-go").addEventListener("click", () => { const v = document.getElementById("voice-q").value.trim(); if (v) Router.push("/search/" + encodeURIComponent(v)); });
  }
};

/* ================= CART PAGE ================= */
Pages.cart = () => {
  const t = State.cartTotals();
  if (!State.cart.length) return `<div class="wrap">${crumb([["Cart"]])}${emptyState("cart", "Your cart is empty", "Every repair starts with the right part.", "/categories", "Start browsing")}</div>`;
  return `<div class="wrap">${crumb([["Cart"]])}
  <div class="sec-head" style="margin-top:12px"><div><span class="kick">Cart</span><h2>${t.count} item${t.count > 1 ? "s" : ""} ready to ship</h2></div></div>
  <div class="co-grid">
    <div>
      <div class="co-sec">
        ${State.cart.map(i => { const p = DB.prodMap[i.sku]; if (!p) return ""; return `
        <div class="citem"><a class="art" href="/p/${p.sku}">${prodArt(p)}</a>
          <div class="inf"><b><a href="/p/${p.sku}">${U.esc(p.name)}</a></b>
            <span class="mut3" style="font-size:11.5px">${catOf(p).name} · <span class="mono">${p.sku}</span> · ${p.warranty} warranty</span>
            ${stockHtml(p)}
            <div class="spread" style="margin-top:5px"><div class="qty"><button data-act="qty" data-sku="${p.sku}" data-d="-1" aria-label="Decrease">${U.icon("minus", "ic-s")}</button><b>${i.qty}</b><button data-act="qty" data-sku="${p.sku}" data-d="1" aria-label="Increase">${U.icon("plus", "ic-s")}</button></div>
            ${CATALOG_MODE ? "" : `<div class="row"><span class="mrp">${p.off ? U.inr(p.mrp * i.qty) : ""}</span><span class="price">${U.inr(p.price * i.qty)}</span></div>`}</div></div>
          <button class="btn btn-icon" data-act="rm-cart" data-sku="${p.sku}" aria-label="Remove">${U.icon("trash", "ic-s")}</button></div>`; }).join("")}
      </div>
      ${CATALOG_MODE || !GFLO.coupons ? "" : `<div class="co-sec"><h3>${U.icon("percent", "ic-s")} Apply coupon</h3>
        <div class="row"><input class="inp" id="coupon-inp" placeholder="Enter coupon code" maxlength="24" autocomplete="off" style="max-width:260px;text-transform:uppercase" value="${State.coupon ? U.esc(State.coupon.code) : ""}"><button class="btn btn-p" id="coupon-go">Apply</button>${State.coupon ? `<button class="btn btn-ghost" id="coupon-rm">Remove</button>` : ""}</div>
        ${State.coupon ? `<p class="mut3" style="font-size:12px;margin-top:9px">${U.icon("check", "ic-s")} <b>${U.esc(State.coupon.code)}</b> — ${U.esc(State.coupon.label || "")}${t.sub < (State.coupon.min || 0) ? ` · <span style="color:var(--warn,#b45309)">add ${U.inr(State.coupon.min - t.sub)} more to use it</span>` : ""}</p>` : ""}</div>`}
    </div>
    <div><div class="co-sec sum-card"><h3>Order summary</h3>
      <div style="display:grid;gap:9px">
        ${CATALOG_MODE ? `<div class="tot-row big"><span>Items</span><span>${t.count}</span></div>
        <p class="mut3" style="font-size:12.5px;margin:0">Pricing is shared on your final quote. Place the enquiry and our team confirms availability, pricing and delivery within 2 business hours.</p>` : `<div class="tot-row"><span>MRP total</span><span>${U.inr(t.mrp)}</span></div>
        <div class="tot-row" style="color:var(--ok)"><span>Discount on MRP</span><span>−${U.inr(t.saveMrp)}</span></div>
        ${t.disc ? `<div class="tot-row" style="color:var(--ok)"><span>Coupon (${U.esc(State.coupon.code)})</span><span>−${U.inr(t.disc)}</span></div>` : ""}
        ${t.freeShip ? `<div class="tot-row" style="color:var(--ok)"><span>Coupon (${U.esc(State.coupon.code)})</span><span>Free delivery</span></div>` : ""}
        <div class="tot-row"><span>Delivery</span><span>${t.ship ? U.inr(t.ship) : "FREE"}</span></div>
        <div class="tot-row"><span>GST (included)</span><span>${U.inr(t.gst)}</span></div>
        <hr style="border:0;border-top:1px dashed var(--line)">
        <div class="tot-row big"><span>Payable</span><span class="price">${U.inr(t.total)}</span></div>
        <span class="badge b-ok" style="justify-self:start">You save ${U.inr(t.saveMrp + t.disc)} on this order</span>`}
      </div>
      <a class="btn btn-p btn-lg btn-block" style="margin-top:16px" href="/checkout">Proceed to checkout ${U.icon("arr-r", "ic-s")}</a>
      <p class="mut3" style="font-size:11.5px;margin-top:10px;text-align:center">${U.icon("shield", "ic-s")} No online payment — we call you to confirm your order</p>
    </div></div>
  </div></div>`;
};
Mount.cart = () => {
  bindSearch("hd-q", "hd-sug");
  const go = document.getElementById("coupon-go");
  const inp = document.getElementById("coupon-inp");
  inp && inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); go && go.click(); } });
  go && go.addEventListener("click", () => {
    const v = (inp.value || "").replace(/\s+/g, "").toUpperCase();
    if (!v){ toast("Enter a coupon code", "warn"); return; }
    if (typeof GFLO === "undefined" || !GFLO.live){ toast("Coupons need an internet connection", "warn"); return; }
    go.disabled = true;
    fetch("/api/coupons/check", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: v, items: State.cart.map(i => ({ sku: i.sku, qty: i.qty })) }) })
      .then(r => r.json().catch(() => ({})))
      .then(d => {
        go.disabled = false;
        if (!d.ok){ toast(d.error || "That coupon didn't work", "warn"); return; }
        State.coupon = { code: d.code, kind: d.kind, value: d.value, min: d.min, max: d.max, label: d.label };
        State.save(); toast("Coupon applied 🎉 " + (d.label || "")); Router.go();
      })
      .catch(() => { go.disabled = false; toast("No internet connection — try again", "err"); });
  });
  const rm = document.getElementById("coupon-rm");
  rm && rm.addEventListener("click", () => { State.coupon = null; State.save(); Router.go(); });
};

/* ================= ORDER CONFIRMATION + TRACK ================= */
const ORDER_STEPS = ["Order placed", "Confirmed & packing", "Shipped", "Out for delivery", "Delivered"];
/* admin status -> how many timeline steps are complete (the next one is "in progress") */
const STATUS_STEP = { new: 1, confirmed: 1, packed: 2, shipped: 3, delivered: 5 };
const STEP_TIME = ["new", "confirmed", "shipped", null, "delivered"];
function orderStatusLabel(o){
  if (o.cancelled) return "Cancelled";
  if (o.statusLabel) return o.statusLabel;              /* exactly what the shop set in the admin */
  if (o.server) return o.status >= 5 ? "Delivered" : ORDER_STEPS[Math.max(0, Math.min(o.status, 5) - 1)];
  return o.status >= 5 ? "Delivered" : ORDER_STEPS[Math.min(o.status, 4)];
}
function fmtWhen(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function orderTimeline(o){
  if (o.cancelled) return `<div class="tl"><span class="dot" style="background:var(--hot);color:#fff">${U.icon("alert", "ic-s")}</span><div><b>Order cancelled</b><span>${o.times && o.times.cancelled ? fmtWhen(o.times.cancelled) : ""} · call us if you have questions</span></div></div>`;
  const eta = deliveryEta((o.addr || "").slice(-6));
  const times = o.times || {};
  return `<div class="timeline">${ORDER_STEPS.map((s, i) => {
    const st = i < o.status ? "done" : i === o.status ? "act" : "";
    let when;
    if (o.server){
      const k = STEP_TIME[i] === "confirmed" ? (times.confirmed ? "confirmed" : "packed") : STEP_TIME[i];
      when = i < o.status ? ((k && times[k]) ? fmtWhen(times[k]) : "Done") : i === o.status ? "In progress" : i === 4 ? "Expected " + eta.label : "Pending";
    } else {
      when = i < o.status ? new Date(o.ts + i * 864e5 * .6).toLocaleDateString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : i === o.status ? "In progress" : i === 4 ? "Expected " + eta.label : "Pending";
    }
    return `<div class="tl ${st}"><span class="dot">${i < o.status ? U.icon("check", "ic-s") : U.icon(["doc", "box", "truck", "pin", "home"][i], "ic-s")}</span><div><b>${s}</b><span>${when}</span></div></div>`;
  }).join("")}</div>`;
}
/* Ask the shop for the latest status of orders placed from this browser.
   Re-renders the page once if anything changed. */
let _orderSyncAt = 0;
function syncOrderStatus(ids){
  if (typeof GFLO === "undefined" || !GFLO.live) return;
  const list = (State.orders || []).filter(o => o.server && o.phone && (!ids || ids.includes(o.id))).slice(0, 15);
  if (!list.length || Date.now() - _orderSyncAt < 3000) return;
  _orderSyncAt = Date.now();
  Promise.all(list.map(o => fetch("/api/orders/" + encodeURIComponent(o.id) + "/status?phone=" + encodeURIComponent(o.phone), { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(d => {
      if (!d || !d.ok) return false;
      const step = d.status === "cancelled" ? o.status : (STATUS_STEP[d.status] ?? o.status);
      const cancelled = d.status === "cancelled";
      const changed = step !== o.status || cancelled !== !!o.cancelled || JSON.stringify(d.times) !== JSON.stringify(o.times);
      o.status = step; o.cancelled = cancelled; o.times = d.times; o.statusLabel = d.label;
      return changed;
    })))
    .then(res => { if (res.some(Boolean)){ State.save(); Router.go(); } });
}
