}
/* The picture for a category, wherever categories are listed (category page,
   Categories menu, filter list). Uses the photo set in the admin or built into
   the site; a category without one (e.g. one added later in the admin) borrows
   its first product photo, so no category is ever shown blank. */
const __catPic = {};
function catPic(id){
  if (CAT_IMG[id]) return CAT_IMG[id];
  if (id in __catPic) return __catPic[id];
  const p = DB.products.find(x => x.cat === id && x.img);
  return (__catPic[id] = p ? p.img : "");
}
function catThumb(id, cls){
  const url = catPic(id);
  const ic = U.icon("c-" + id, "ic-s");
  return `<span class="${cls}">${url ? `<img src="${U.esc(url)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<span class="ct-fb">${ic}</span></span>`;
}
function prodMediaIdx(p, idx, label){
  const svg = artFor(p.art, p.hue, p.seed + (idx ? "|t" + idx : ""), label || p.name);
  const url = prodPhotoUrls(p)[idx || 0] || "";
  /* the artwork stays layered behind the photo: it keeps the 360 spin and the
     hover zoom working, and shows through if the photo fails to load */
  if (!url) return `<span class="pm">${svg}</span>`;
  return `<span class="pm">${svg}<img src="${U.esc(url)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()"></span>`;
}
/* Override the base renderer: photo-first with layered SVG fallback */
prodArt = function(p, label){ return prodMediaIdx(p, 0, label); };

function bindSearch(inputId, sugId){
  const inp = document.getElementById(inputId), sug = document.getElementById(sugId);
  if (!inp || !sug || inp.dataset.bound) return;
  inp.dataset.bound = "1";
  let selIdx = -1;
  const close = () => { sug.classList.remove("open"); inp.setAttribute("aria-expanded", "false"); selIdx = -1; };
  const go = q => { if (!q.trim()) return; close(); Router.push("/search/" + encodeURIComponent(q.trim())); };
  const render = () => {
    const q = inp.value;
    if (q.trim().length < 2){ close(); return; }
    const { products, cats, brands, pts, intent } = Search.suggest(q);
    const il = AI.intentLabel(intent);
    let html = "";
    if (il) html += `<div class="sug-intent">${U.icon("spark", "ic-s")} <span><b>AI understood:</b> ${U.esc(il)}</span></div>`;
    if (cats.length || brands.length || pts.length){
      html += `<div class="sug-gr"><div class="sug-tt">Collections</div>${cats.map(c => `<a class="sug-it" href="/c/${c.id}"><span class="si-ic">${U.icon("c-" + c.id, "ic-s")}</span><span><b>${U.esc(c.name)}</b><small>${c.pts.length} part families</small></span></a>`).join("")}${brands.map(b => `<a class="sug-it" href="/b/${b.id}"><span class="si-ic">${U.icon("store", "ic-s")}</span><span><b>${U.esc(b.name)}</b><small>Brand store</small></span></a>`).join("")}${pts.map(t => `<a class="sug-it" href="/search/${encodeURIComponent(t.name)}"><span class="si-ic">${U.icon("cog", "ic-s")}</span><span><b>${U.esc(t.name)}</b><small>Across all appliances</small></span></a>`).join("")}</div>`;
    }
    if (products.length){
      html += `<div class="sug-gr"><div class="sug-tt">Parts</div>${products.map(p => `<a class="sug-it" href="/p/${p.sku}"><span class="si-art">${prodArt(p)}</span><span style="min-width:0"><b>${U.esc(p.short)}</b><small>${catOf(p).name} · ★ ${p.rating}</small></span>${CATALOG_MODE ? "" : `<span class="price">${U.inr(p.price)}</span>`}</a>`).join("")}</div>`;
    }
    html += `<div class="sug-gr"><button class="sug-it" data-go-search="${U.esc(q)}"><span class="si-ic">${U.icon("search", "ic-s")}</span><span><b>Search “${U.esc(q)}”</b><small>See all matching parts</small></span></button></div>`;
    sug.innerHTML = html; sug.classList.add("open"); inp.setAttribute("aria-expanded", "true");
  };
  inp.addEventListener("input", U.debounce(render, 160));
  inp.addEventListener("focus", render);
  inp.addEventListener("keydown", e => {
    const items = [...sug.querySelectorAll(".sug-it")];
    if (e.key === "Enter"){ e.preventDefault(); if (selIdx >= 0 && items[selIdx]){ items[selIdx].click(); } else go(inp.value); }
    if (e.key === "Escape") close();
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      selIdx = U.clamp(selIdx + (e.key === "ArrowDown" ? 1 : -1), 0, items.length - 1);
      items.forEach((it, i) => it.classList.toggle("sel", i === selIdx));
      if (items[selIdx]) items[selIdx].scrollIntoView({ block: "nearest" });
    }
  });
  document.addEventListener("click", e => { if (!inp.closest(".hd-search,.hero-search")?.contains(e.target)) close(); });
  sug.addEventListener("click", e => { const b = e.target.closest("[data-go-search]"); if (b) go(b.getAttribute("data-go-search")); const a = e.target.closest("a"); if (a) close(); });
}

function startVoice(targetId, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const inp = document.getElementById(targetId);
  if (!SR){
    toast("Voice input isn't available in this preview — try the demo phrase", "info");
    if (inp){ typeInto(inp, "Bajaj mixer grinder coupler under 300"); }
    return;
  }
  try {
    const rec = new SR(); rec.lang = "en-IN"; rec.interimResults = false;
    btn && btn.classList.add("rec");
    toast("Listening… speak your part or model number", "info");
    rec.onresult = e => { const t = e.results[0][0].transcript; if (inp){ inp.value = t; inp.dispatchEvent(new Event("input")); inp.focus(); } };
    rec.onend = () => btn && btn.classList.remove("rec");
    rec.onerror = () => { btn && btn.classList.remove("rec"); toast("Mic unavailable here — typed a demo query instead", "warn"); if (inp) typeInto(inp, "demolition hammer piston"); };
    rec.start();
  } catch(err){ if (inp) typeInto(inp, "ceiling fan capacitor"); }
}
function typeInto(inp, text){
  let i = 0; inp.value = ""; inp.focus();
  const t = setInterval(() => { inp.value = text.slice(0, ++i); inp.dispatchEvent(new Event("input")); if (i >= text.length) clearInterval(t); }, 28);
}

    } else if (/slow|not working|broken|repair|fix|problem|noise|leak/.test(ql)){

/* ================= GLOBAL EVENTS ================= */
function bindGlobal(){
  document.addEventListener("click", e => {
    const act = e.target.closest("[data-act]");
    const mic = e.target.closest("[data-mic]");
    const mcat = e.target.closest("[data-mega-cat]");
    if (mic){ startVoice(mic.getAttribute("data-mic"), mic); return; }
    if (mcat){ megaCat = mcat.getAttribute("data-mega-cat"); buildMega(); return; }
    if (!act){
      if (!e.target.closest(".mega-wr") && !e.target.closest("#mega")) document.querySelectorAll(".mega.open").forEach(m => { m.classList.remove("open"); });
      return;
    }
    const a = act.getAttribute("data-act"), sku = act.getAttribute("data-sku");
    if (a === "close" || e.target.id === "ovl-bg") closeOverlays();
    if (a === "open-cart"){ renderCartDrawer(); openDrawer("cart-drawer"); }
    if (a === "open-mnav") openDrawer("mnav");
    if (a === "mega"){ if (window.matchMedia("(max-width:767px)").matches){ Router.push("/categories"); return; } const m = document.getElementById("mega"); const open = m.classList.toggle("open"); act.setAttribute("aria-expanded", open); }
    if (a === "chat"){ const c = document.getElementById("chat"); c.classList.add("open"); c.setAttribute("aria-hidden", "false"); document.getElementById("ovl-bg").classList.add("open"); document.getElementById("chat-q").focus(); }
    if (a === "add-cart") State.addCart(sku, 1);
    if (a === "buy-now"){ State.addCart(sku, 1, true); Router.push("/checkout"); }
    if (a === "wish"){ State.toggleWish(sku); refreshActionStates(); if (Router.parse().page === "wishlist") Router.go(); }
    if (a === "cmp"){ State.toggleCmp(sku); refreshActionStates(); }
    if (a === "qty"){ const it = State.inCart(sku); State.setQty(sku, (it ? it.qty : 1) + (+act.getAttribute("data-d"))); renderCartDrawer(); if (["cart", "checkout"].includes(Router.parse().page)) Router.go(); }
    if (a === "rm-cart"){ State.rmCart(sku); renderCartDrawer(); toast("Removed from cart", "info"); if (["cart", "checkout"].includes(Router.parse().page)) Router.go(); }
    if (a === "quick") quickView(sku);
    if (a === "share"){
      const p = DB.prodMap[sku]; const txt = `${p.short} — ${U.inr(p.price)} on G-FLO`;
      if (navigator.share){ navigator.share({ title: txt, text: txt }).catch(() => {}); }
      else if (navigator.clipboard){ navigator.clipboard.writeText(txt + " " + location.href).then(() => toast("Link copied to clipboard")); }
      else toast("Sharing isn't available in this preview", "info");
    }
  });
  document.getElementById("ovl-bg").addEventListener("click", closeOverlays);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlays(); if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); document.getElementById("hd-q").focus(); } });
  /* Back / forward buttons. Replaces the old "hashchange" listener now that
     navigation goes through history.pushState instead of location.hash. */
  window.addEventListener("popstate", () => Router.go());

  /* One interceptor for every internal link, so all the ordinary <a href="/...">
     tags in the pages navigate without a full page load. Anything that is not
     a plain left-click on a same-site route is left completely alone: modified
     clicks (new tab), target="_blank", downloads, other hostnames, mailto/tel,
     and in-page anchors like href="#main" all behave normally. */
  document.addEventListener("click", e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    if (a.target && a.target !== "" && a.target !== "_self") return;
    if (a.hasAttribute("download") || a.getAttribute("rel") === "external") return;
    const raw = a.getAttribute("href") || "";
    if (!raw || raw.charAt(0) === "#") return;                 /* in-page anchor */
    if (/^[a-z][a-z0-9+.-]*:/i.test(raw) && !/^https?:/i.test(raw)) return;  /* mailto:, tel: */
    let u;
    try { u = new URL(raw, location.href); } catch (err) { return; }
    if (u.origin !== location.origin) return;                  /* other hostname */
    /* real files and the server-rendered admin are not app routes */
    if (/^\/(admin|api|media|static|assets|brand-photos|tools-photos)(\/|$)/.test(u.pathname)) return;
    const last = u.pathname.split("/").pop();
    if (last && last.indexOf(".") > 0) return;                 /* looks like a file */
    e.preventDefault();
    Router.push(u.pathname + u.search);
  });
}

    ${CATALOG_MODE ? "" : `<div class="fblock"><h4>Price (₹)</h4><div class="range-row"><input class="inp" type="number" min="0" placeholder="Min" data-f="min" aria-label="Minimum price"><span class="mut3">–</span><input class="inp" type="number" min="0" placeholder="Max" data-f="max" aria-label="Maximum price"></div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:11px">${[[0, 199], [200, 499], [500, 999], [1000, 4999]].map(r => `<button class="chip" data-price="${r[0]}-${r[1]}" style="font-size:11.5px;padding:5px 10px">₹${r[0]}–${r[1]}</button>`).join("")}</div></div>`}
    <div class="fblock"><h4>Rating</h4>${[4.5, 4, 3.5].map(r => `<label class="fopt"><input type="radio" name="frt" data-f="rating" value="${r}"> ${r}★ & above</label>`).join("")}<label class="fopt"><input type="radio" name="frt" data-f="rating" value="0" checked> Any rating</label></div>
    <div class="fblock"><h4>More</h4><label class="fopt"><input type="checkbox" data-f="stock"> In stock only</label>${CATALOG_MODE ? "" : `<label class="fopt"><input type="checkbox" data-f="deal"> On deal (25%+ off)</label>`}</div>

  return `

          </div>
        </div>
        <div class="active-f" id="active-f"></div>

        <div class="sentinel" id="sentinel"></div>
      </div>

}
function listingApply(){
  const f = LX.f;
  let list = LX.pool.filter(p =>
    (!f.pts.size || f.pts.has(p.pt)) &&
    (!f.cats.size || f.cats.has(p.cat)) &&
    (!f.brands.size || p.brandFor.some(b => f.brands.has(b))) &&
    (f.min === "" || p.price >= +f.min) && (f.max === "" || p.price <= +f.max) &&
    (!f.rating || p.rating >= f.rating) && (!f.stock || p.stock > 0) && (!f.deal || p.off >= 25));
  const S = { pop: (a, b) => b.sold - a.sold, new: (a, b) => (b.isNew - a.isNew) || b.sold - a.sold, plh: (a, b) => a.price - b.price, phl: (a, b) => b.price - a.price, rate: (a, b) => b.rating - a.rating, off: (a, b) => b.off - a.off };
  list.sort(S[LX.sort] || S.pop);
  return list;
}
function listingChips(){
  const f = LX.f, out = [];
  f.pts.forEach(x => out.push(["pts", x, PT_MAP[x].name]));
  f.cats.forEach(x => out.push(["cats", x, CAT_MAP[x].name]));
  f.brands.forEach(x => out.push(["brands", x, BRAND_MAP[x].name]));
  if (f.min !== "" || f.max !== "") out.push(["price", "", `₹${f.min || 0}–${f.max || "∞"}`]);
  if (f.rating) out.push(["rating", "", f.rating + "★+"]);
  if (f.stock) out.push(["stock", "", "In stock"]);
  if (f.deal) out.push(["deal", "", "On deal"]);
  document.getElementById("active-f").innerHTML = out.map(c => `<button class="chip on" data-rm-f="${c[0]}" data-v="${c[1]}" style="font-size:12px">${U.esc(c[2])} ${U.icon("x", "ic-s")}</button>`).join("");
}
function listingRender(reset){
  const grid = document.getElementById("plist"), sent = document.getElementById("sentinel");
  const list = listingApply();
  document.getElementById("res-count").textContent = list.length + " parts found";
  listingChips();
  if (reset){ LX.shown = 0; grid.innerHTML = skeletonCards(8); }
  const draw = () => {
    if (reset) grid.innerHTML = "";
    const next = list.slice(LX.shown, LX.shown + 12);
    grid.insertAdjacentHTML("beforeend", next.map((p, i) => productCard(p, i)).join(""));
    LX.shown += next.length;
    revealInit(grid);
    if (!list.length) grid.innerHTML = `<div style="grid-column:1/-1">${emptyState("box", "No parts match these filters", "Try clearing a filter or use the AI finder to locate your part.", "/finder", "Open AI finder")}</div>`;
    sent.innerHTML = LX.shown < list.length ? `<div class="spinner" aria-label="Loading more"></div>` : (list.length ? `<span>— you've seen all ${list.length} parts —</span>` : "");
  };
  reset ? setTimeout(draw, 420) : draw();
}
function listingMount(){
  bindSearch("hd-q", "hd-sug");
  const filters = document.getElementById("filters");
  listingRender(true);
  filters.addEventListener("change", e => {
    const el = e.target, k = el.getAttribute("data-f"); if (!k) return;
    if (k === "min" || k === "max") LX.f[k] = el.value;
    else if (k === "rating") LX.f.rating = +el.value;
    else if (k === "stock" || k === "deal") LX.f[k] = el.checked;
    else { el.checked ? LX.f[k].add(el.value) : LX.f[k].delete(el.value); }
    listingRender(true);
  });
  filters.addEventListener("input", U.debounce(e => { const k = e.target.getAttribute("data-f"); if (k === "min" || k === "max"){ LX.f[k] = e.target.value; listingRender(true); } }, 400));
  filters.addEventListener("click", e => {
    const pr = e.target.closest("[data-price]");
    if (pr){ const [a, b] = pr.getAttribute("data-price").split("-"); LX.f.min = a; LX.f.max = b; filters.querySelector("[data-f=min]").value = a; filters.querySelector("[data-f=max]").value = b; listingRender(true); }
    if (e.target.closest("[data-clear-f]")){ Router.go(); }
  });
  document.getElementById("sort-sel").addEventListener("change", e => { LX.sort = e.target.value; listingRender(true); });
  document.getElementById("active-f").addEventListener("click", e => {
    const c = e.target.closest("[data-rm-f]"); if (!c) return;
    const k = c.getAttribute("data-rm-f"), v = c.getAttribute("data-v");
    if (k === "price"){ LX.f.min = LX.f.max = ""; } else if (k === "rating") LX.f.rating = 0; else if (k === "stock" || k === "deal") LX.f[k] = false; else LX.f[k].delete(v);
    filters.querySelectorAll("input").forEach(i => { const fk = i.getAttribute("data-f"); if (fk === k && (i.value === v || k === "price" || k === "rating")) { if (i.type === "checkbox" || i.type === "radio") i.checked = fk === "rating" && i.value === "0"; else i.value = ""; } if ((k === "stock" || k === "deal") && fk === k) i.checked = false; });
    listingRender(true);
  });

  if (LX.io) LX.io.disconnect();
  LX.io = new IntersectionObserver(es => { if (es[0].isIntersecting && LX.shown > 0) listingRender(false); }, { rootMargin: "600px" });

  const fo = document.getElementById("f-open");

      document.getElementById("modal-wr").addEventListener("transitionend", function h(){ if (!document.getElementById("modal-wr").classList.contains("open")){ putBack(); this.removeEventListener("transitionend", h); } });
    });
  }
}

Mount.product = skuIn => {

  bindSearch("hd-q", "hd-sug");

  document.querySelectorAll("[data-pq]").forEach(b => b.addEventListener("click", () => { qty = U.clamp(qty + (+b.getAttribute("data-pq")), 1, 99); document.getElementById("pq").textContent = qty; }));

  document.getElementById("p-buy").addEventListener("click", () => { State.addCart(buySku, qty, true); Router.push("/checkout"); });
  document.querySelectorAll("[data-var]").forEach(b => b.addEventListener("click", () => {
    buySku = b.getAttribute("data-var");
    const v = DB.prodMap[buySku]; if (!v) return;
    document.querySelectorAll("[data-var]").forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
    const cur = document.getElementById("var-cur"); if (cur) cur.textContent = v.variant;
    const pr = document.getElementById("p-price"); if (pr) pr.innerHTML = priceHtml(v);
  }));
  // tabs
  document.querySelectorAll("[data-ptab]").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll("[data-ptab]").forEach(x => { x.classList.toggle("on", x === t); x.setAttribute("aria-selected", x === t); });
    document.querySelectorAll(".ptab-body").forEach(b => b.classList.add("hide"));
    document.getElementById("tabc-" + t.getAttribute("data-ptab")).classList.remove("hide");
  }));
  document.querySelectorAll("[data-tab-link]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.querySelector(`[data-ptab=${a.getAttribute("data-tab-link")}]`).click(); document.querySelector(".ptabs").scrollIntoView({ behavior: "smooth" }); }));
  // gallery: zoom + thumbs + 360
  const stage = document.getElementById("gal-stage"), main = document.getElementById("gal-main");
  let mode = "static";
  const setThumb = i => { stage.innerHTML = prodMediaIdx(p, i, p.name); document.querySelectorAll(".gth").forEach((g, gi) => { g.classList.toggle("on", gi === i); g.setAttribute("aria-selected", gi === i); }); };
  document.querySelectorAll(".gth").forEach((g, i) => g.addEventListener("click", () => { mode = "static"; main.classList.remove("v360"); setThumb(i); }));
  main.addEventListener("mousemove", e => {
    if (mode !== "static") return;
    const r = main.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
    const svg = stage.querySelector("svg");
    if (svg){ svg.style.transformOrigin = `${x}% ${y}%`; svg.style.transform = "scale(2.1)"; }
  });
  main.addEventListener("mouseleave", () => { const svg = stage.querySelector("svg"); if (svg){ svg.style.transform = ""; } });
  // compatibility
  document.getElementById("cmp-check").addEventListener("click", () => {
    const res = AI.compatCheck(p, document.getElementById("cmp-brand").value, document.getElementById("cmp-model").value);
    const el = document.getElementById("cmp-res");
    el.className = "compat-res " + (res.ok ? "ok" : "no");
    el.innerHTML = (res.ok ? U.icon("check") : U.icon("alert")) + `<div>${U.esc(res.msg)}${!res.ok && res.near && res.near.length ? `<div style="font-weight:500;margin-top:5px;font-size:12.5px">Close matches in list: ${res.near.map(m => `<b class="mono">${m}</b>`).join(", ")}</div>` : ""}${!res.ok && res.alt ? `<div style="margin-top:7px"><a href="/p/${res.alt.sku}" class="btn btn-soft btn-sm">View the part that fits ${U.esc(document.getElementById("cmp-model").value.toUpperCase())} →</a></div>` : ""}</div>`;
  });
  // pincode
  document.getElementById("pin-check").addEventListener("click", () => {
    const v = document.getElementById("pin-inp").value.trim();
    if (!/^\d{6}$/.test(v)){ toast("Enter a valid 6-digit pincode", "warn"); return; }
    State.pin = v; State.save();
    const eta = deliveryEta(v);
    document.getElementById("pin-res").innerHTML = `Delivery to ${v} by <b>${eta.label}</b>${CATALOG_MODE ? " · pan-India tracked shipping" : ` · ${p.price >= 4999 ? "FREE" : "₹99"} shipping · COD available`}`;
    toast("Delivery estimate updated");
  });
  // downloads
  document.querySelectorAll("[data-dl]").forEach(b => b.addEventListener("click", () => {
    const name = b.getAttribute("data-dl");
    const txt = `GFLO — ${name}\nPart: ${p.name}\nSKU: ${p.sku}\nCompatible models: ${p.compat.join(", ") || "See online listing"}\nWarranty: ${p.warranty}\nSupport: care@g-flo.shop · 1800-419-GFLO\n\n(Deliverable stub — in production this is a brand PDF.)`;
    try {
      const url = URL.createObjectURL(new Blob([txt], { type: "text/plain" }));
      const a = document.createElement("a"); a.href = url; a.download = U.slug(p.sku + "-" + name) + ".txt"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Download started");
    } catch(e){ modal(`<pre style="white-space:pre-wrap;font-size:12.5px" class="mono">${U.esc(txt)}</pre>`, { title: name }); }
  }));
  // FBT
  const fbtTotal = () => {
    const skus = [...document.querySelectorAll(".fbt-ck:checked")].map(c => c.value);
    const t = skus.reduce((s, k) => s + (DB.prodMap[k] ? DB.prodMap[k].price : 0), 0);
    const el = document.getElementById("fbt-total"); if (el) el.textContent = CATALOG_MODE ? skus.length + " parts" : U.inr(t);
    return skus;
  };
  fbtTotal();
  document.querySelectorAll(".fbt-ck").forEach(c => c.addEventListener("change", fbtTotal));
  const fbtBtn = document.getElementById("fbt-add");
  fbtBtn && fbtBtn.addEventListener("click", () => { const skus = fbtTotal(); skus.forEach(k => State.addCart(k, 1, true)); toast(skus.length + " parts added to cart"); renderCartDrawer(); openDrawer("cart-drawer"); });
};

Mount.checkout = () => {
  bindSearch("hd-q", "hd-sug");
  const form = document.getElementById("co-form");
  const pinEl = document.getElementById("f-pin"), stEl = document.getElementById("f-state");
  let stTouched = false;
  if (stEl) stEl.addEventListener("change", () => { stTouched = !!stEl.value; stEl.closest(".fld").classList.remove("bad"); });
  const suggest = () => { if (!stTouched && stEl && /^\d{6}$/.test(pinEl.value)){ const st = stateForPin(pinEl.value); if (st) stEl.value = st; } };
  if (pinEl){ pinEl.addEventListener("input", suggest); suggest(); }
  const shipExtra = 0;
  form.addEventListener("submit", e => {
    e.preventDefault();
    let ok = true;
    form.querySelectorAll(".fld input[required], .fld select[required]").forEach(i => { const bad = !i.checkValidity(); i.closest(".fld").classList.toggle("bad", bad); if (bad) ok = false; });
    if (!ok){ toast("Please fix the highlighted fields", "err"); return; }
    const btn = form.querySelector("[type=submit]");
    const label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = `<span class="spinner" style="width:18px;height:18px;border-width:2.5px"></span> Placing order…`;
    const v = id => document.getElementById(id).value.trim();
    const ship = "std";
    const customer = { name: v("f-name"), phone: v("f-phone"), address: v("f-addr"), city: v("f-city"), state: v("f-state"), pincode: v("f-pin") };
    const addr = customer.address + ", " + customer.city + ", " + customer.state + " — " + customer.pincode;
    if (typeof GFLO === "undefined" || !GFLO.live){
      /* offline preview (no server): keep the old local-only behaviour */
      const order = State.placeOrder({ name: customer.name, phone: customer.phone, addr, gstin: null, shipExtra });
      Router.push("/order/" + order.id); return;
    }
    const fail = msg => { btn.disabled = false; btn.innerHTML = label; toast(msg || "Couldn't place the order. Please try again.", "err"); };
    fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...customer, ship, coupon: State.coupon && State.cartTotals().disc + (State.cartTotals().freeShip ? 1 : 0) > 0 ? State.coupon.code : "",
        items: State.cart.map(i => ({ sku: i.sku, qty: i.qty })) }) })
      .then(r => r.json().catch(() => ({})).then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (d && d.coupon_error){
          /* coupon expired / used up since it was applied: drop it and show the real total */
          State.coupon = null; State.save(); Router.go();
          toast((d.error || "").replace(" Remove the coupon in your cart to continue.", "") + " The coupon was removed — please check the total and place the order again.", "warn");
          return;
        }
        if (!ok || !d.ok) return fail(d.error);
        const sub = d.subtotal || 0, disc = d.discount || 0;
        const order = { id: d.number, ts: Date.now(), server: true, status: 0,
          items: State.cart.map(i => ({ ...i })), lines: d.items || [],
          totals: { sub, disc, ship: d.shipping || 0, gst: Math.round((sub - disc) * .18), total: d.total || 0, quote: d.quote_items || 0 },
          name: customer.name, phone: customer.phone, addr, ship, shipExtra: 0 };
        State.orders.unshift(order); State.cart = []; State.coupon = null; State.save();
        Router.push("/order/" + encodeURIComponent(order.id));
      })
      .catch(() => fail("No internet connection — your order was not placed. Please try again."));
  });
};

/* ================= ORDER CONFIRMATION + TRACK ================= */
const ORDER_STEPS = ["Order placed", "Confirmed & packing", "Shipped", "Out for delivery", "Delivered"];
/* admin status -> how many timeline steps are complete (the next one is "in progress") */
const STATUS_STEP = { new: 1, confirmed: 1, packed: 2, shipped: 3, delivered: 5 };
const STEP_TIME = ["new", "confirmed", "shipped", null, "delivered"];
function orderStatusLabel(o){
  if (o.cancelled) return "Cancelled";
  if (o.statusLabel) return o.statusLabel;              /* exactly what the shop set in the admin */
  if (o.server) return o.status >= 5 ? "Delivered" : ORDER_STEPS[Math.max(0, Math.min(o.status, 5) - 1)];
  return o.status >= 5 ? "Delivered" : ORDER_STEPS[Math.min(o.status, 4)];
}
function fmtWhen(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function orderTimeline(o){
  if (o.cancelled) return `<div class="tl"><span class="dot" style="background:var(--hot);color:#fff">${U.icon("alert", "ic-s")}</span><div><b>Order cancelled</b><span>${o.times && o.times.cancelled ? fmtWhen(o.times.cancelled) : ""} · call us if you have questions</span></div></div>`;
  const eta = deliveryEta((o.addr || "").slice(-6));
  const times = o.times || {};
  return `<div class="timeline">${ORDER_STEPS.map((s, i) => {
    const st = i < o.status ? "done" : i === o.status ? "act" : "";
    let when;
    if (o.server){
      const k = STEP_TIME[i] === "confirmed" ? (times.confirmed ? "confirmed" : "packed") : STEP_TIME[i];
      when = i < o.status ? ((k && times[k]) ? fmtWhen(times[k]) : "Done") : i === o.status ? "In progress" : i === 4 ? "Expected " + eta.label : "Pending";
    } else {
      when = i < o.status ? new Date(o.ts + i * 864e5 * .6).toLocaleDateString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : i === o.status ? "In progress" : i === 4 ? "Expected " + eta.label : "Pending";
    }
    return `<div class="tl ${st}"><span class="dot">${i < o.status ? U.icon("check", "ic-s") : U.icon(["doc", "box", "truck", "pin", "home"][i], "ic-s")}</span><div><b>${s}</b><span>${when}</span></div></div>`;
  }).join("")}</div>`;
}
/* Ask the shop for the latest status of orders placed from this browser.
   Re-renders the page once if anything changed. */
let _orderSyncAt = 0;
function syncOrderStatus(ids){
  if (typeof GFLO === "undefined" || !GFLO.live) return;
  const list = (State.orders || []).filter(o => o.server && o.phone && (!ids || ids.includes(o.id))).slice(0, 15);
  if (!list.length || Date.now() - _orderSyncAt < 3000) return;
  _orderSyncAt = Date.now();
  Promise.all(list.map(o => fetch("/api/orders/" + encodeURIComponent(o.id) + "/status?phone=" + encodeURIComponent(o.phone), { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(d => {
      if (!d || !d.ok) return false;
      const step = d.status === "cancelled" ? o.status : (STATUS_STEP[d.status] ?? o.status);
      const cancelled = d.status === "cancelled";
      const changed = step !== o.status || cancelled !== !!o.cancelled || JSON.stringify(d.times) !== JSON.stringify(o.times);
      o.status = step; o.cancelled = cancelled; o.times = d.times; o.statusLabel = d.label;
      return changed;
    })))
    .then(res => { if (res.some(Boolean)){ State.save(); Router.go(); } });
}

function miniSteps(o){

  const max = Math.max(...data) * 1.15, step = w / (data.length - 1);
  const pts = data.map((v, i) => [i * step, h - v / max * (h - 22) - 6]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Trend chart">
    <defs><linearGradient id="ga${w}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color || "#ec3338"}" stop-opacity=".35"/><stop offset="1" stop-color="${color || "#ec3338"}" stop-opacity="0"/></linearGradient></defs>
    ${[.25, .5, .75].map(f => `<line x1="0" y1="${h * f}" x2="${w}" y2="${h * f}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>`).join("")}
    <path d="${line} L ${w} ${h} L 0 ${h} Z" fill="url(#ga${w})"/>
    <path d="${line}" fill="none" stroke="${color || "#ec3338"}" stroke-width="2.5" stroke-linecap="round"/>
    ${pts.filter((_, i) => i % 5 === 0 || i === pts.length - 1).map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color || "#ec3338"}"/>`).join("")}
  </svg>`;
}
function svgBars(pairs, color){
  const w = 560, h = 190, max = Math.max(...pairs.map(p => p[1])) * 1.12, bw = w / pairs.length;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Bar chart">
    ${pairs.map((p, i) => { const bh = p[1] / max * (h - 40); return `<rect x="${(i * bw + bw * .18).toFixed(1)}" y="${(h - 24 - bh).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${bh.toFixed(1)}" rx="6" fill="${color || "#f59e0b"}" opacity="${.55 + .45 * (p[1] / max)}"/><text x="${(i * bw + bw / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10.5" fill="var(--tx3)" font-family="Inter">${U.esc(p[0])}</text>`; }).join("")}
  </svg>`;
}
function svgDonut(segs){
  const tot = segs.reduce((s, x) => s + x[1], 0); let acc = 0;
  const arcs = segs.map(s => {
    const a0 = acc / tot * Math.PI * 2 - Math.PI / 2; acc += s[1];
    const a1 = acc / tot * Math.PI * 2 - Math.PI / 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = a => [70 + 52 * Math.cos(a), 70 + 52 * Math.sin(a)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A 52 52 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${s[2]}" stroke-width="17" stroke-linecap="butt"/>`;
  }).join("");
  return `<svg viewBox="0 0 140 140" style="max-width:150px" role="img" aria-label="Share chart">${arcs}<text x="70" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="var(--tx)" font-family="Space Grotesk">${tot.toLocaleString("en-IN")}</text><text x="70" y="83" text-anchor="middle" font-size="9.5" fill="var(--tx3)" font-family="Inter">orders</text></svg>`;
}
function stChip(s){
  const M = { Delivered: "b-ok", Shipped: "b-info", Packed: "b-best", New: "b-brand", Cancelled: "b-off", Returned: "b-deal", Refunded: "b-info", Open: "b-deal", Resolved: "b-ok", Pending: "b-best", Active: "b-ok", Paused: "b-off", Low: "b-low" };
  return `<span class="st-chip ${M[s] || "b-info"}">${s}</span>`;
}

(async function init(){
  document.documentElement.dataset.theme = "light";
  // pull the live catalogue from the backend, then compile the product database
  if (typeof loadCatalog === "function"){ await loadCatalog(); }
  buildDB();
  const boot = () => {
    try { const lk = document.querySelector('link[rel="icon"]'); if (lk && typeof BRAND_MARK === "string") lk.href = BRAND_MARK; } catch(e){}

    Router.upgradeLegacyHash();
