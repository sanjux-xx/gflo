/* ============ GFLO DESIGN SYSTEM ============ */
:root{

  --e:cubic-bezier(.22,1,.36,1);

}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff; --bg2:#f6f7fa; --card:#ffffff; --card2:#f8f9fc;
  --line:#e7eaf0; --line2:#d9dde6;

  --sh-lg:0 20px 50px -22px rgba(16,24,40,.22);
  --hd-bg:rgba(255,255,255,.9);
  --chip:#f2f4f8;
  --art-bg1:#f6f8fc; --art-bg2:#eef1f7; --art-line:rgba(224,47,39,.10);

  --heroA:rgba(242,88,72,.09); --heroB:rgba(224,47,39,.10);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;font-family:var(--ff);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .3s,color .3s;overflow-x:clip;max-width:100vw}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
::selection{background:rgba(236,51,56,.35)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:6px}
#app:focus,#app:focus-visible,main[tabindex="-1"]:focus{outline:none}

/* layout */
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(16px,4vw,32px)}

/* ---- brand home: the creatives shown like the hero poster — a plain picture
   on black, no card and no caption. Each sits in a band of the SAME height so
   the column reads evenly (the posters are portrait, the tool photo landscape;
   left to their own devices they ranged from 565px to 1050px tall). The image
   is contained, never stretched: it was being blown up 17% past its real size,
   which is what made it look soft. ---- */
.brand-strip{background:#000;padding:0 0 clamp(30px,5vw,66px)}
/* the wrap is narrowed and its side padding dropped so each poster spans the
   full column instead of sitting small in a 1280px field */
.brand-strip .wrap{max-width:1080px;padding:0;display:flex;flex-direction:column;
  align-items:center;gap:clamp(10px,1.6vw,22px)}
.bs-shot{margin:0;width:100%;display:flex;justify-content:center}
/* No radius and no shadow on purpose. Four of the five creatives are posters
   whose own background is rgb(1,1,1), so against #000 with no frame their edge
   is invisible and the page reads as one continuous canvas — a rounded, glowing
   card is what made the surrounding black look like empty margin.
   max-height keeps one poster to roughly one screen on desktop; on a phone the
   width cap wins and each one fills the screen edge to edge. */
.bs-shot img{display:block;margin:0 auto;width:auto;height:auto;
  max-width:100%;max-height:92vh;
  transition:transform var(--tslow),filter var(--tslow)}
.bs-shot:hover img{transform:scale(1.012);filter:brightness(1.06)}
@media (max-width:640px){ .bs-shot img{max-height:none;width:100%} .brand-strip .wrap{gap:0} }
.line-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.line-card{position:relative;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/4.6;display:block;background:#fff}
.line-card img{width:100%;height:100%;object-fit:cover;transition:transform var(--tslow)}
.line-card:hover img{transform:scale(1.06)}
.line-card .lc-cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.line-card .lc-cap b{font-family:var(--fd);font-size:16.5px;display:block}
.line-card .lc-cap span{font-size:12px;opacity:.82;display:inline-flex;align-items:center;gap:5px;margin-top:3px}

.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;font-family:var(--fd)}
.tst .who b{display:block;font-size:13px}
.tst .who span{font-size:11.5px;color:var(--tx3)}

/* newsletter */
.news{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--g);padding:clamp(28px,5vw,54px);color:#fff;text-align:center}
.news::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:38px 38px}
.news>*{position:relative}
.news h2{font-size:clamp(22px,3.4vw,34px)}
.news p{opacity:.85;margin:10px auto 22px;max-width:440px;font-size:14px}
.news form{display:flex;gap:10px;max-width:440px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.news .inp{flex:1;min-width:220px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.news .inp::placeholder{color:rgba(255,255,255,.7)}
.news .btn{background:#fff;color:var(--brand)}

/* footer */
.foot{background:var(--bg2);border-top:1px solid var(--line);margin-top:clamp(30px,6vw,60px)}
.foot-top{display:grid;gap:30px;padding:clamp(30px,5vw,54px) 0}
@media(min-width:900px){.foot-top{grid-template-columns:1.4fr 1fr 1fr 1fr 1.2fr}}
.foot h5{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin-bottom:14px}
.foot-lnks{display:flex;flex-direction:column;gap:9px}
.foot-lnks a{font-size:13.5px;color:var(--tx3);transition:color var(--tfast);width:max-content}
.foot-lnks a:hover{color:var(--brand2)}
.foot .about{font-size:13px;color:var(--tx3);line-height:1.7;margin-top:12px;max-width:300px}
.foot-pay{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.foot-pay .tag{font-family:var(--fm);font-size:10.5px}
.foot-bot{border-top:1px solid var(--line);padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--tx3)}
.soc{display:flex;gap:8px}
.soc a{width:36px;height:36px;border-radius:11px;background:var(--chip);display:grid;place-items:center;color:var(--tx2);transition:all var(--tfast)}
.soc a:hover{background:var(--g-soft);color:var(--brand2)}

/* breadcrumb */
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx3);flex-wrap:wrap;padding:16px 0 4px}
.crumb a:hover{color:var(--brand2)}
.crumb .sep{opacity:.5}
.crumb b{color:var(--tx2);font-weight:600}

/* listing layout */
.listing{display:grid;gap:22px;padding-bottom:50px}
@media(min-width:1000px){.listing{grid-template-columns:262px 1fr}}
.filters{display:none}
@media(min-width:1000px){.filters{display:block;position:sticky;top:170px;align-self:start;max-height:calc(100vh - 190px);overflow-y:auto;padding-right:6px}}
.filters.as-drawer{display:block;position:static;max-height:none}
.fblock{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;margin-bottom:12px}
.fblock h4{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.fopt{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:13.5px;color:var(--tx2);cursor:pointer;border-radius:8px}
.fopt:hover{color:var(--tx)}
.fopt input{accent-color:var(--brand);width:16px;height:16px}
.fopt .cnt{margin-left:auto;font-size:11.5px;color:var(--tx3)}
.range-row{display:flex;gap:8px;align-items:center}
.range-row .inp{padding:8px 10px;font-size:13px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .res{font-size:13px;color:var(--tx3)}
.toolbar .sel{width:auto;padding-block:9px;font-size:13px}
.active-f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sentinel{display:grid;place-items:center;padding:28px;color:var(--tx3);font-size:13px}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--brand);animation:spin 0.8s linear infinite}

/* skeletons */
.sk{position:relative;overflow:hidden;background:var(--chip);border-radius:10px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);animation:shine 1.4s infinite}
html[data-theme="light"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent)}
@keyframes shine{to{transform:translateX(100%)}}
.sk-card{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--card)}
.sk-card .a{aspect-ratio:1}
.sk-card .b{padding:14px;display:flex;flex-direction:column;gap:9px}

/* product page */
.pdp{display:grid;gap:clamp(20px,3.5vw,44px);padding:10px 0 50px}
@media(min-width:960px){.pdp{grid-template-columns:1.05fr 1fr}}
.gal{position:sticky;top:180px;align-self:start}
@media(max-width:959px){.gal{position:static}}
.gal-main{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line);background:linear-gradient(150deg,var(--art-bg1),var(--art-bg2));aspect-ratio:1;cursor:zoom-in}
.gal-main .pm svg{width:100%;height:100%}   /* the product artwork only */
/* NOT ".gal-main svg" — that also matched the badge and 360-button icons
   inside the gallery and stretched them to fill the stage (a 16px shield
   rendered ~358x150px on top of the photo). */
.gal-main .zoom-lens{position:absolute;inset:0;opacity:0;transition:opacity var(--tfast);background-size:220%;pointer-events:none}
.gal-main:hover .zoom-lens{opacity:1}
.gal-thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.gth{width:70px;height:70px;flex:none;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(150deg,var(--art-bg1),var(--art-bg2));transition:border-color var(--tfast);cursor:pointer}
.gth.on{border-color:var(--brand)}
.gth svg{width:100%;height:100%}
.v360{touch-action:pan-y;cursor:grab}
.v360:active{cursor:grabbing}
.pinfo h1{font-size:clamp(20px,2.6vw,28px);font-family:var(--ff);font-weight:700;line-height:1.3;letter-spacing:0}
.pinfo .sub-ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--tx3)}
.p-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0 4px}
.p-price .price{font-size:clamp(26px,3vw,34px)}
.p-price .mrp{font-size:15px}
.p-price .off{font-size:14px}
.from-ln{font-size:12px;font-weight:600;color:var(--tx3);margin-right:-3px}
.var-box{margin:14px 0 6px}
.var-lbl{font-size:13.5px;color:var(--tx2);margin-bottom:9px}
.var-lbl b{color:var(--tx)}
.var-opts{display:flex;flex-wrap:wrap;gap:8px}
.var-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:96px;padding:9px 13px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color var(--tfast),box-shadow var(--tfast)}
.var-opt small{font-size:12px;font-weight:700;color:var(--brand2)}
.var-opt:hover{border-color:var(--brand)}
.var-opt.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(236,51,56,.14);background:var(--g-soft)}
.var-opt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tax-ln{font-size:12px;color:var(--tx3)}
.compat-box{margin:18px 0;padding:16px;border-radius:var(--r-l);border:1.5px dashed var(--brand);background:var(--g-soft)}
.compat-box h4{font-size:14px;display:flex;gap:8px;align-items:center;margin-bottom:10px}
.compat-form{display:flex;gap:8px;flex-wrap:wrap}
.compat-form .sel,.compat-form .inp{flex:1;min-width:130px}
.compat-res{margin-top:12px;font-size:13.5px;font-weight:600;display:none;align-items:flex-start;gap:9px;padding:11px 13px;border-radius:12px}
.compat-res.ok{display:flex;background:rgba(16,185,129,.12);color:var(--ok)}
.compat-res.no{display:flex;background:rgba(244,63,94,.1);color:var(--hot)}
.buy-row{display:flex;gap:11px;margin:20px 0 12px;flex-wrap:wrap}
.buy-row .btn{flex:1;min-width:150px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden}
.qty button{width:38px;height:44px;display:grid;place-items:center;color:var(--tx2);transition:all var(--tfast)}
.qty button:hover{background:var(--chip);color:var(--tx)}
.qty b{width:40px;text-align:center;font-size:15px}
.meta-acts{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 18px}
.meta-act{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--tx2);transition:color var(--tfast)}
.meta-act:hover{color:var(--brand2)}
.meta-act.on{color:var(--hot)}
.ship-box{border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.ship-row{display:flex;gap:12px;align-items:flex-start;font-size:13px}
.ship-row .ic{color:var(--brand2);margin-top:1px}
.ship-row b{font-size:13px}
.pin-form{display:flex;gap:8px}
.pin-form .inp{max-width:170px;padding-block:9px}
.spec-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.spec-tbl td{padding:11px 12px;border-bottom:1px solid var(--line)}
.spec-tbl td:first-child{color:var(--tx3);width:42%;font-weight:500}
.spec-tbl tr:last-child td{border:0}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:8px}
.ptab{padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--tx3);border-bottom:2px solid transparent;white-space:nowrap;transition:all var(--tfast)}
.ptab.on{color:var(--tx);border-color:var(--brand)}
.ptab-body{padding:20px 2px}
.rev-sum{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.rev-big{font-family:var(--fd);font-size:46px;font-weight:700;line-height:1}
.rev-bars{flex:1;min-width:210px;display:flex;flex-direction:column;gap:5px}
.rbar{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--tx3)}
.rbar .tr{flex:1;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.rbar .fl{height:100%;border-radius:4px;background:var(--amb)}
.rev{border-top:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column;gap:8px}
.rev .who{display:flex;align-items:center;gap:10px;font-size:13px}
.rev p{font-size:13.5px;color:var(--tx2)}
.qa-item{border-top:1px solid var(--line);padding:14px 0}
.qa-item .q{font-weight:600;font-size:14px;display:flex;gap:8px}
.qa-item .a{margin-top:7px;font-size:13.5px;color:var(--tx2);padding-left:24px}
.step-list{display:flex;flex-direction:column;gap:14px;counter-reset:st}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{counter-increment:st;width:30px;height:30px;border-radius:10px;background:var(--g-soft);color:var(--brand2);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--fd);flex:none}
.step .n::before{content:counter(st)}
.step b{display:block;font-size:14px;margin-bottom:3px}
.step p{font-size:13px;color:var(--tx2)}
.dl-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;transition:border-color var(--tfast)}
.dl-row:hover{border-color:var(--brand)}
.dl-row .ic{color:var(--hot)}
.dl-row b{font-size:13.5px;display:block}
.dl-row small{color:var(--tx3);font-size:11.5px}
.dl-row .btn{margin-left:auto}
.fbt{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.fbt .fbt-items{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fbt-mini{width:120px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.fbt-mini .art{aspect-ratio:1;background:linear-gradient(150deg,var(--art-bg1),var(--art-bg2))}
.fbt-mini .bd{padding:9px}
.fbt-mini b{font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.35;min-height:2.7em}
.fbt-mini .price{font-size:12.5px}
.fbt-mini input{position:absolute;top:8px;left:8px;width:16px;height:16px;accent-color:var(--brand)}
.fbt-plus{font-size:20px;color:var(--tx3);align-self:center}
.fbt-total{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:200px}

/* cart / drawers */
.ovl-bg{position:fixed;inset:0;background:rgba(4,7,14,.6);backdrop-filter:blur(3px);z-index:290;opacity:0;pointer-events:none;transition:opacity var(--tmed)}
.ovl-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(430px,94vw);background:var(--bg);border-left:1px solid var(--line);z-index:300;transform:translateX(102%);transition:transform var(--tmed);display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.drawer.open{transform:none}
.drawer.left{right:auto;left:0;transform:translateX(-102%);border-left:0;border-right:1px solid var(--line)}
.drawer.left.open{transform:none}
.dr-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-hd h3{font-size:17px}
.dr-body{flex:1;overflow-y:auto;padding:16px 20px}
.dr-ft{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:11px;background:var(--card)}
.citem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.citem .art{width:74px;height:74px;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,var(--art-bg1),var(--art-bg2));flex:none}
.citem .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.citem b{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.citem .qty{transform:scale(.82);transform-origin:left}
.citem .qty button{height:36px}
.free-bar{background:var(--chip);border-radius:12px;padding:11px 13px;font-size:12.5px}
.free-bar .tr{height:7px;border-radius:5px;background:var(--bg);margin-top:8px;overflow:hidden}
.free-bar .fl{height:100%;background:var(--g);border-radius:5px;transition:width .5s var(--e)}
.tot-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--tx2)}
.tot-row.big{font-size:16.5px;font-weight:700;color:var(--tx)}
.tot-row .price{font-size:inherit}

/* modal */
.modal-wr{position:fixed;inset:0;z-index:320;display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:opacity var(--tmed)}
.modal-wr.open{opacity:1;pointer-events:auto}
.modal-wr .m-bg{position:absolute;inset:0;background:rgba(4,7,14,.65);backdrop-filter:blur(4px)}
.modal{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-lg);width:min(620px,100%);max-height:88vh;overflow-y:auto;transform:translateY(18px) scale(.98);transition:transform var(--tmed)}
.modal-wr.open .modal{transform:none}
.modal-hd{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.modal-bd{padding:22px}
.modal.wide{width:min(880px,100%)}

/* toast */
#toasts{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:min(430px,92vw)}
@media(min-width:768px){#toasts{bottom:26px}}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-lg);border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:600;animation:tin .4s var(--e);width:100%}
.toast.out{animation:tout .3s var(--e) forwards}
.toast .ic{color:var(--ok)}
.toast.warn .ic{color:var(--warn)}.toast.err .ic{color:var(--hot)}.toast.info .ic{color:var(--brand2)}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.96)}}

/* mobile bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:250;display:grid;grid-template-columns:repeat(5,1fr);background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
@media(min-width:768px){.bnav{display:none}}
.bnav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:10px;font-weight:600;color:var(--tx3);border-radius:12px}
.bnav a.on{color:var(--brand2)}
.bnav a .bub{position:absolute;top:2px;right:calc(50% - 21px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--hot);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center}
body{padding-bottom:74px}
@media(min-width:768px){body{padding-bottom:0}}

/* assistant */
#ai-fab{position:fixed;right:18px;bottom:92px;z-index:260;width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px -8px rgba(224,47,39,.7);transition:transform var(--tfast)}
#ai-fab:hover{transform:scale(1.07)}
@media(min-width:768px){#ai-fab{bottom:26px;right:26px}}
.chat{position:fixed;right:14px;bottom:158px;z-index:310;width:min(392px,calc(100vw - 28px));height:min(560px,70vh);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-lg);display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(20px) scale(.97);transition:all var(--tmed)}
@media(min-width:768px){.chat{bottom:96px;right:26px}}
.chat.open{opacity:1;pointer-events:auto;transform:none}
.chat-hd{display:flex;align-items:center;gap:11px;padding:14px 16px;background:var(--g);color:#fff}
.chat-hd .st{font-size:11px;opacity:.85;display:flex;align-items:center;gap:5px}
.chat-hd .st::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80}
.chat-bd{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg2)}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.5}
.msg.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--brand);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg .mini-p{display:flex;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:9px;align-items:center}
.msg .mini-p .art{width:44px;height:44px;border-radius:9px;overflow:hidden;flex:none;background:var(--art-bg1)}
.msg .mini-p b{font-size:12px;display:block;line-height:1.3}
.msg .mini-p .price{font-size:12.5px}
.chat-sugs{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 10px;background:var(--bg2)}
.chat-sugs .chip{font-size:11.5px;padding:6px 11px}
.chat-in{display:flex;gap:9px;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg)}
.chat-in .inp{flex:1}
.typing{display:inline-flex;gap:4px;padding:13px 15px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--tx3);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{40%{transform:translateY(-5px);opacity:1}}

/* finder / AI hub */
.hub-hero{background:var(--g);border-radius:var(--r-xl);color:#fff;padding:clamp(24px,4.5vw,46px);position:relative;overflow:hidden;margin-top:18px}
.hub-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:36px 36px}
.hub-hero>*{position:relative}
.hub-tabs{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}
.hub-tab{display:inline-flex;align-items:center;gap:8px;padding:11px 17px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:13.5px;color:var(--tx2);transition:all var(--tfast)}
.hub-tab.on{border-color:var(--brand);background:var(--g-soft);color:var(--brand2)}
.wizard{display:grid;gap:18px}
@media(min-width:900px){.wizard{grid-template-columns:1fr 1fr}}
.wz-steps{display:flex;flex-direction:column;gap:10px}
.wz-step{display:flex;gap:13px;padding:15px;border-radius:var(--r-l);border:1.5px solid var(--line);background:var(--card);transition:all var(--tfast)}
.wz-step.on{border-color:var(--brand);background:var(--g-soft)}
.wz-step.done{opacity:.75}
.wz-num{width:32px;height:32px;border-radius:11px;background:var(--chip);display:grid;place-items:center;font-family:var(--fd);font-weight:700;flex:none}
.wz-step.on .wz-num{background:var(--g);color:#fff}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;margin-top:12px}
.opt-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:12px;font-weight:600;text-align:center;color:var(--tx2);transition:all var(--tfast)}
.opt-tile:hover{border-color:var(--brand2)}
.opt-tile.on{border-color:var(--brand);background:var(--g-soft);color:var(--tx)}
.opt-tile .ic{width:24px;height:24px;color:var(--brand2)}
.drop{border:2px dashed var(--line2);border-radius:var(--r-l);padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center;color:var(--tx2);transition:all var(--tfast);background:var(--card)}
.drop.hov{border-color:var(--brand);background:var(--g-soft)}
.drop .ic{width:38px;height:38px;color:var(--brand2)}
.scan-vis{position:relative;border-radius:var(--r-l);overflow:hidden;max-width:340px}
.scan-vis img{width:100%;display:block}
.scan-line{position:absolute;left:0;right:0;height:3px;background:var(--brand2);box-shadow:0 0 18px var(--brand2);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%,100%{top:6%}50%{top:92%}}
.conf-bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:5px}
.conf-bar i{display:block;height:100%;background:var(--g);border-radius:5px;transition:width .8s var(--e)}
.mic-big{width:92px;height:92px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;margin:12px auto;box-shadow:0 16px 40px -12px rgba(224,47,39,.7);transition:transform var(--tfast)}
.mic-big:hover{transform:scale(1.05)}
.mic-big.rec{animation:pl 1.2s infinite}
.mic-big .ic{width:36px;height:36px}

/* checkout / account / track */
.co-grid{display:grid;gap:22px;padding-bottom:50px}
@media(min-width:980px){.co-grid{grid-template-columns:1.5fr 1fr}}
.co-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(16px,2.5vw,24px);margin-bottom:16px}
.co-sec h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.co-sec h3 .n{width:26px;height:26px;border-radius:9px;background:var(--g-soft);color:var(--brand2);display:grid;place-items:center;font-size:13px;font-family:var(--fd)}
.form-grid{display:grid;gap:13px}
@media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
.fld-row3{display:grid;gap:13px}
@media(min-width:640px){.fld-row3{grid-template-columns:.8fr 1.1fr 1.1fr}}
.co-sec h3 .ic{color:var(--brand2)}
.sum-card .tot-row{align-items:center}
body.checkout-page #ai-fab{display:none!important}
.pay-opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:all var(--tfast)}
.pay-opt.on{border-color:var(--brand);background:var(--g-soft)}
.pay-opt input{accent-color:var(--brand);width:17px;height:17px}
.sum-card{position:sticky;top:180px}
.timeline{display:flex;flex-direction:column;gap:0;margin-top:10px}
.tl{display:flex;gap:15px;position:relative;padding-bottom:26px}
.tl::before{content:"";position:absolute;left:14px;top:30px;bottom:2px;width:2px;background:var(--line2)}
.tl:last-child::before{display:none}
.tl .dot{width:30px;height:30px;border-radius:50%;background:var(--chip);border:2px solid var(--line2);display:grid;place-items:center;flex:none;z-index:1;color:var(--tx3)}
.tl.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl.act .dot{background:var(--g);border-color:var(--brand);color:#fff;box-shadow:0 0 0 5px rgba(236,51,56,.18)}
.tl.done::before{background:var(--ok)}
.tl b{font-size:14px;display:block}
.ms{display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.ms::before{content:"";position:absolute;left:10%;right:10%;top:11px;height:2px;background:var(--line2)}
.ms::after{content:"";position:absolute;left:10%;width:var(--p,0%);top:11px;height:2px;background:var(--ok)}
.ms-st{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;min-width:0}
.ms-dot{width:24px;height:24px;border-radius:50%;background:var(--chip);border:2px solid var(--line2);display:grid;place-items:center;color:#fff;z-index:1}
.ms-dot .ic{width:13px;height:13px}
.ms-st.done .ms-dot{background:var(--ok);border-color:var(--ok)}
.ms-st.act .ms-dot{background:var(--g);border-color:var(--brand);box-shadow:0 0 0 4px rgba(236,51,56,.16)}
.ms-lb{font-size:11.5px;line-height:1.25;color:var(--tx3);font-weight:600}
.ms-st.done .ms-lb,.ms-st.act .ms-lb{color:var(--tx)}
.ms-cancel{display:flex;align-items:center;gap:8px;color:var(--hot);font-weight:700;font-size:13.5px}
.tl span{font-size:12.5px;color:var(--tx3)}
.acc-grid{display:grid;gap:18px;padding-bottom:50px}
@media(min-width:900px){.acc-grid{grid-template-columns:250px 1fr}}
.acc-nav{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:10px;height:max-content;position:sticky;top:180px}
/* was overflow-x:auto, which pushed "Admin login" — the last of seven
   items — off the right edge on a phone. Wrapping shows all of them. */
@media(max-width:899px){.acc-nav{flex-direction:row;flex-wrap:wrap;overflow-x:visible;position:static}}
/* separates the staff link from the shopper links in the mobile menu */
.dr-admin{margin-top:10px;padding-top:14px;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.acc-lnk{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:all var(--tfast)}
.acc-lnk.on,.acc-lnk:hover{background:var(--g-soft);color:var(--tx)}
.order-card{border:1px solid var(--line);border-radius:var(--r-l);padding:16px;margin-bottom:13px;background:var(--card)}

/* dashboards */
.dash{display:grid;gap:0;min-height:calc(100vh - 200px)}
@media(min-width:1000px){.dash{grid-template-columns:236px 1fr}}
.dash-side{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;height:max-content;position:sticky;top:176px;margin-bottom:18px}
@media(max-width:999px){.dash-side{position:static;display:flex;overflow-x:auto;gap:4px;padding:8px}}
@media(min-width:1000px){.dash{gap:20px}}
.dash-main{padding-bottom:50px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--g)}
.kpi .k-ic{width:38px;height:38px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;margin-bottom:12px}
.kpi b{font-family:var(--fd);font-size:23px;display:block}
.kpi span{font-size:12px;color:var(--tx3)}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;gap:4px;align-items:center}
.delta.up{color:var(--ok)}.delta.dn{color:var(--hot)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(15px,2vw,21px);margin-bottom:16px;min-width:0}
.panel h3{font-size:15px;margin-bottom:14px}
.tbl-wr{overflow-x:auto;margin:0 -6px;padding:0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border:0}
.tbl tr:hover td{background:var(--card2)}
.st-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px}
.st-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chart-wr{width:100%;overflow:hidden}
.chart-wr svg{width:100%;height:auto}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
.role-pill{display:inline-flex;gap:2px;background:var(--chip);border-radius:12px;padding:3px}
.role-pill button{padding:7px 13px;border-radius:9px;font-size:12px;font-weight:600;color:var(--tx3);transition:all var(--tfast)}
.role-pill button.on{background:var(--g);color:#fff}
.lock-note{display:flex;gap:11px;align-items:center;padding:14px;border-radius:14px;background:rgba(249,115,22,.1);color:var(--warn);font-size:13px;font-weight:600;margin-bottom:16px}

/* invoice */
.inv{background:#fff;color:#111;border-radius:16px;padding:28px;font-size:13px}
.inv h2{color:#111}
.inv table{width:100%;border-collapse:collapse;margin:14px 0}
.inv th,.inv td{border:1px solid #ddd;padding:8px 10px;text-align:left}
.inv th{background:#f3f4f6;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.inv .tot td{font-weight:700}

/* deals */
.deal-hero{border-radius:var(--r-xl);overflow:hidden;background:linear-gradient(120deg,#be123c,#f43f5e 50%,#f97316);color:#fff;padding:clamp(24px,4.5vw,46px);position:relative;margin-top:18px}
.deal-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:36px 36px}
.deal-hero>*{position:relative}
.cd{display:flex;gap:9px;margin-top:16px}
.cd .cell{background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border-radius:12px;padding:9px 13px;text-align:center;min-width:62px}
.cd .cell b{font-family:var(--fm);font-size:21px;display:block}
.cd .cell span{font-size:10px;opacity:.85;text-transform:uppercase;letter-spacing:.08em}

/* misc pages */
.empty{display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center;padding:60px 20px;color:var(--tx2)}
.empty .e-ic{width:76px;height:76px;border-radius:24px;background:var(--chip);display:grid;place-items:center;color:var(--tx3)}
.empty .e-ic .ic{width:34px;height:34px}
.faq-item{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 17px;font-weight:600;font-size:14px;text-align:left}
.faq-a{max-height:0;overflow:hidden;transition:max-height var(--tmed);font-size:13.5px;color:var(--tx2)}
.faq-item.open .faq-a{max-height:300px}
.faq-a>div{padding:0 17px 15px}
.faq-q .ic{transition:transform var(--tmed)}
.faq-item.open .faq-q .ic{transform:rotate(180deg)}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.sup-tile{display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);transition:all var(--tmed)}
.sup-tile:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--brand)}
.sup-tile .ic{width:26px;height:26px;color:var(--brand2)}
.cmp-wr{overflow-x:auto;padding-bottom:20px}
.cmp-tbl{border-collapse:collapse;min-width:680px;width:100%}
.cmp-tbl th,.cmp-tbl td{border:1px solid var(--line);padding:13px;font-size:13px;text-align:left;vertical-align:top}
.cmp-tbl th:first-child,.cmp-tbl td:first-child{position:sticky;left:0;background:var(--card);min-width:130px;color:var(--tx3);font-weight:500}
.cmp-tbl .art{width:110px;height:110px;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,var(--art-bg1),var(--art-bg2))}

/* page transition */
#app>.pg{animation:pgin .45s var(--e)}
@keyframes pgin{from{opacity:0;transform:translateY(12px)}}

@media print{
  body>*{display:none!important}
  #print-zone{display:block!important}
}
</style>

const GUIDES = [
  ["fix-mixer-coupler","Replace a Mixer Grinder Jar Coupler","mixer-grinder","Easy",12,"A worn coupler makes a rattling sound and the blade stops spinning under load.",["Unplug the mixer and remove the jar.","Hold the base coupler with a cloth and unscrew the jar coupler anti-clockwise (most models).","Thread the new coupler on clockwise until snug — do not overtighten.","Refit the jar and test at speed 1 before full speed."],["Flat cloth","Adjustable spanner"],["Never work with the unit plugged in.","Check coupler teeth alignment before first run."]],
  ["drill-carbon-brush","Replace Drill Machine Carbon Brushes","drill-machine","Easy",15,"Heavy sparking, weak torque or a burning smell usually means the brushes are worn to the leads.",["Unplug the drill and open the two brush caps (or rear housing) beside the motor.","Slide out the old brushes and note the curve worn into their faces.","Insert the new pair with the curve matching the commutator direction.","Run the drill unloaded for two minutes so the brushes seat evenly."],["Screwdriver","Small brush or blower"],["Never run the drill with one worn and one new brush.","Blow out carbon dust away from your face."]],
  ["grinder-armature","Angle Grinder Sparking? Check the Armature","angle-grinder","Moderate",30,"Ring sparking at the commutator points to a shorted or burnt armature winding.",["Unplug and remove the brush caps, then the gear-head screws.","Slide the armature out and inspect the commutator for blackened or missing segments.","Test winding continuity segment-to-segment with a multimeter.","Fit the new armature, re-grease the gears and reassemble in reverse order."],["Screwdriver set","Multimeter","Bearing grease"],["Wear cut-resistant gloves around the disc area.","Replace both brushes whenever the armature is changed."]],
  ["geyser-thermostat","Replace a Geyser Thermostat","geyser","Moderate",30,"Lukewarm water or constant tripping usually points to the thermostat.",["Switch off the MCB and drain the tank via the release valve.","Remove the bottom cover and photograph the wiring.","Pull out the capillary thermostat and slide the new one into the same pocket.","Rewire, refill the tank completely, then power on and set to 55°C."],["Screwdriver set","Adjustable wrench"],["Never power a geyser with an empty tank.","Use only ISI-marked replacements."]],
  ["fan-capacitor","Slow Ceiling Fan? Change the Capacitor","ceiling-fan","Easy",15,"A tired capacitor is the #1 reason fans lose speed.",["Turn off the fan circuit at the MCB, not just the regulator.","Open the bottom canopy to expose the capacitor.","Note the MFD value, swap in the new capacitor with identical rating.","Close the canopy and test through all regulator speeds."],["Ladder","Screwdriver","Tester"],["Confirm zero voltage with a tester before touching wires.","Use 440V-rated capacitors only."]],
  ["stove-low-flame","Gas Stove Low Flame? Clean the Burner & Valve","gas-stove","Easy",20,"A yellow or weak flame is almost always a clogged burner or a sticky control valve.",["Close the cylinder valve and let the stove cool completely.","Lift off the burner, soak it in soapy water and clear each port with a pin.","Pull the knob and check the valve spindle — clean and apply food-safe grease if stiff.","Refit, open the gas and confirm an even blue flame on all ports."],["Pin or wire brush","Food-safe grease"],["Work in a ventilated kitchen with the cylinder closed.","Never enlarge burner ports — replace the burner instead."]],
  ["cooker-gasket","Pressure Cooker Leaking Steam? Gasket & Whistle Care","pressure-cooker","Easy",12,"Steam escaping from the lid rim means the gasket has hardened; a jammed vent is a safety issue.",["Remove the gasket and check for cracks, flattening or stretch.","Wash the lid groove and seat the new gasket evenly all round.","Unscrew the vent weight, clear the vent tube and refit the safety valve if corroded.","Do a water-only test run and confirm the first whistle arrives normally."],["Soft cloth","Wooden pick"],["Never operate a cooker with a damaged safety valve.","Replace the gasket every 12–18 months of regular use."]],
  ["iron-element","Fix a Dead Electric Iron","iron","Easy",18,"No heat usually means a broken element or thermal fuse.",["Unplug and remove the rear cover and cord clamp.","Test the element terminals for continuity.","Replace the element or thermal fuse as needed.","Reassemble, checking the earth wire is secured."],["Screwdriver","Multimeter"],["Let the soleplate cool fully before opening.","Route the cord away from the soleplate."]],
  ["kettle-element","Electric Kettle Not Boiling","electric-kettle","Easy",15,"Scale kills kettle elements — here's the fix.",["Unplug and empty the kettle, then open the base plate.","Disconnect the element spades and remove the mounting ring.","Fit the new element with a fresh silicone seal.","Descale monthly with citric acid to extend life."],["Screwdriver","Descaler"],["Check the seal seating to prevent leaks onto live parts."]],
  ["chainsaw-chain","Chainsaw Chain Tension & Sprocket Care","chainsaw","Moderate",25,"A loose chain derails; a hooked sprocket eats new chains for breakfast.",["Unplug or remove the battery, then loosen the bar nuts.","Set tension so the chain lifts about 3 mm at mid-bar and still spins by gloved hand.","Inspect the drive sprocket — replace it if the teeth show hook wear.","Retighten the bar, oil the chain and run a slow test cut."],["Bar wrench","Gloves","Chain oil"],["Always work with the machine fully de-energised.","Replace the chain and sprocket together after two chain cycles."]],
  ["cooler-pump","Air Cooler Pump Not Lifting Water","air-cooler","Easy",15,"Dry pads with a full tank means the pump or pipe is blocked.",["Unplug the cooler and remove the rear grill.","Detach the pump, clear the inlet strainer of scale.","If the impeller doesn't spin freely, replace the pump.","Prime the pipe, refit, and check even pad wetting."],["Screwdriver","Vinegar for descaling"],["Empty the tank before working.","Run the pump only when submerged."]],
  ["pump-seal","Water Pump Dripping? Replace the Mechanical Seal","water-pump","Pro",40,"A steady drip from behind the impeller means the mechanical seal has failed.",["Isolate power and water, then open the pump casing bolts.","Unscrew the impeller (usually anti-clockwise) to expose the seal.","Press out the old seal halves and clean the shaft and housing seat.","Fit the new seal with clean hands, refit the impeller and check for leaks at pressure."],["Spanner set","Soft mallet"],["Capacitors inside pump heads store charge — discharge first.","Never touch the new seal faces with bare fingers."]]

<script>
"use strict";
/* ================= LIVE CATALOGUE (backend API) =================
   The catalogue, categories, prices, stock, contact details and the
   show-prices switch all come from the Python backend at /api/catalog,
   where the admin panel writes them.

   If the API can't be reached (file:// preview, backend restarting,
   network blip) the page silently falls back to the catalogue baked
   into this file, so the store never renders empty.

   Hosting the HTML on a different domain to the API? Set
   window.GFLO_API_BASE = "https://your-api.example.com" before this
   script runs.                                                     */

const GFLO = {
  base: (typeof window !== "undefined" && window.GFLO_API_BASE) || "",
  live: false,           // true once the API answered
  rows: [],              // catalogue rows in the shape buildDB() ingests
  settings: {},
};

/* the catalogue compiled into this file, mapped to the API's shape */
function bakedRows(){
  return REAL.map(r => ({
    name: r[0], cat: REAL_CAT_IDS[r[1]], pt: r[8],
    price: r[2], mrp: r[3], por: false,
    stock: r[7] ? 25 : 0, unit: "piece",
    size: "", pack: "", colours: "", material: "", note: "", group: "",
    warranty: "", weight: "", brands: [],
    rating: r[5], reviews: r[6],
    isNew: false, isBest: false, isFeat: false,
    img: r[4] ? (r[4][0] === "@" ? r[4].slice(1) : REAL_IMG_PREFIX + r[4]) : "",
    sku: ""
  }));
}

/* merge categories coming from the backend into CATS / CAT_MAP */
function mergeCategories(list){
  if (!Array.isArray(list) || !list.length) return;
  list.forEach(c => {
    const existing = CAT_MAP[c.id];
    if (existing){
      existing.name = c.name || existing.name;
      existing.desc = c.desc || existing.desc;
      existing.popular = !!c.popular;
      if (c.img) CAT_IMG[c.id] = c.img;
      return;
    }
    const cat = { id: c.id, name: c.name, code: c.code || "GN", hue: c.hue || 210,
                  desc: c.desc || "", pts: [], brands: [], popular: !!c.popular,
                  icon: c.icon || "c-tools" };
    CATS.push(cat); CAT_MAP[cat.id] = cat;
    if (c.img) CAT_IMG[c.id] = c.img;
  });
}

function mergeBrands(list){
  if (!Array.isArray(list)) return;
  list.forEach(b => {
    if (BRAND_MAP[b.id]) return;
    const brand = { id: b.id, name: b.name, hue: b.hue || 210 };
    BRANDS.push(brand); BRAND_MAP[brand.id] = brand;
  });
}

function applySettings(s, showPrices){
  GFLO.settings = s || {};
  if (typeof showPrices === "boolean") CATALOG_MODE = !showPrices;
  if (s && typeof CONTACT === "object" && CONTACT){
    /* These are dropped straight into page HTML (footer, support page, price
       labels), so make them safe text here, once, before anything uses them. */
    const t = v => U.esc(String(v).slice(0, 300));
    if (s.contact_email) CONTACT.email = t(s.contact_email);
    if (s.contact_phone) CONTACT.phone = t(s.contact_phone);
    if (s.contact_phone2) CONTACT.phone2 = t(s.contact_phone2);
    if (s.contact_address) CONTACT.address = t(s.contact_address);
    if (s.whatsapp) CONTACT.whatsapp = t(s.whatsapp);
    if (s.por_label) window.POR_LABEL = t(s.por_label);
    if (s.price_note) window.PRICE_NOTE = t(s.price_note);
  }
}

/* Everything in the catalogue is typed by staff or imported from a spreadsheet,
   and the pages drop it straight into HTML. So clean it ONCE, here, as it
   arrives: no text value can carry markup (< > " ' become look-alike
   typographic characters, so 5" Blade still reads 5″ Blade), codes are limited
   to safe characters and photo links must be real photo addresses. */
const SAFE_ID = v => String(v ?? "").replace(/[^A-Za-z0-9~._-]/g, "-").slice(0, 120);
const SAFE_URL = v => { const u = String(v ?? "").trim();
  return (/^(\/(?!\/)|https:\/\/)[^\s"'<>`\\]*$/.test(u) && u.length < 600) ? u : ""; };
const SAFE_TXT = v => String(v ?? "").replace(/</g, "‹").replace(/>/g, "›").replace(/"/g, "″").replace(/'/g, "’").replace(/`/g, "ʼ");
const ID_KEYS = new Set(["sku", "id", "cat", "pt", "code", "icon", "parent"]);
const URL_KEYS = new Set(["img", "image", "image_url", "imgMobile"]);
const URL_LIST_KEYS = new Set(["imgs", "gallery", "images"]);
function cleanCatalog(v, key){
  if (v === null || v === undefined || typeof v === "number" || typeof v === "boolean") return v;
  if (Array.isArray(v)){
    if (URL_LIST_KEYS.has(key)) return v.map(SAFE_URL).filter(Boolean);
    /* a product's "brands" is a list of brand ids; the catalogue's top-level
       "brands" is a list of brand objects — only the ids are cleaned as ids */
    if (key === "brands") return v.map(x => (x && typeof x === "object") ? cleanCatalog(x, "") : SAFE_ID(x));
    return v.map(x => cleanCatalog(x, key));
  }
  if (typeof v === "object"){
    const out = {};
    Object.keys(v).forEach(k => { out[k] = cleanCatalog(v[k], k); });
    return out;
  }
  if (ID_KEYS.has(key)) return SAFE_ID(v);
  if (URL_KEYS.has(key)) return SAFE_URL(v);
  return SAFE_TXT(v);
}

async function loadCatalog(){
  let data = null;
  // Snapshot mode: instead of fetching, a catalogue can be embedded in the page —
  // set window.GFLO_PRELOAD to the same JSON that /api/catalog returns. Handy for
  // static hosting and offline previews. The admin panel still needs the backend.
  if (typeof window !== "undefined" && window.GFLO_PRELOAD){
    data = cleanCatalog(window.GFLO_PRELOAD, "");
    console.info("[G-FLO] snapshot catalogue embedded in the page");
  } else try {
    const ctrl = typeof AbortController === "function" ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
    const res = await fetch(GFLO.base + "/api/catalog",
                            { headers: { "Accept": "application/json" }, signal: ctrl && ctrl.signal });
    if (timer) clearTimeout(timer);
    if (!res.ok) throw new Error("API returned " + res.status);
    data = cleanCatalog(await res.json(), "");
    if (!data || !Array.isArray(data.products) || !data.products.length)
      throw new Error("API returned an empty catalogue");
  } catch (err){
    GFLO.rows = bakedRows();
    GFLO.live = false;
    console.warn("[G-FLO] using the built-in catalogue —", err.message);
    return GFLO.rows;
  }
  // the catalogue is good — apply the rest defensively so one bad field
  // can never cost us the live product list
  try { mergeCategories(data.categories); } catch (e){ console.warn("[G-FLO] categories:", e.message); }
  try { mergeBrands(data.brands); } catch (e){ console.warn("[G-FLO] brands:", e.message); }
  try { applySettings(data.settings, data.showPrices); } catch (e){ console.warn("[G-FLO] settings:", e.message); }
  GFLO.coupons = data.couponsEnabled === true;       /* owner's switch in Admin -> Coupons */
  GFLO.rows = data.products.filter(p => p && CAT_MAP[p.cat]);
  GFLO.live = true;
  console.info("[G-FLO] live catalogue loaded — " + GFLO.rows.length + " products");
  return GFLO.rows;
}
</script>
<script>
"use strict";
/* ================= DB BUILD ================= */
const DB = { products: [], prodMap: {}, models: {}, modelList: [] };
function buildDB(){
  // model numbers per brand+cat
  CATS.forEach(cat => {
    cat.brands.forEach(bid => {
      const b = BRAND_MAP[bid]; if (!b) return;
      const r = U.rng(bid + cat.id);
      const codes = [];
      const n = 3 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++){
        const code = (b.name.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase()) + "-" + cat.code + Math.floor(300 + r() * 700) + "XZKQVLM"[Math.floor(r() * 7)];
        codes.push(code);
        DB.modelList.push({ code, brand: bid, cat: cat.id });
      }
      DB.models[bid + "|" + cat.id] = codes;
    });
  });
  // catalogue ingestion — rows come from the backend (/api/catalog), or from the
  // copy baked into this file when the API can't be reached. See src/026-api.html.
  let serial = 100;
  DB.products.length = 0;
  const CAT_ROWS = (typeof GFLO !== "undefined" && GFLO.rows && GFLO.rows.length)
    ? GFLO.rows : (typeof bakedRows === "function" ? bakedRows() : []);
  CAT_ROWS.forEach((row, idx) => {
    const name = row.name, cat = CAT_MAP[row.cat];
    if (!cat) return;
    const price = (row.price === null || row.price === undefined || row.price === "") ? null : Number(row.price);
    const mrp0 = (row.mrp === null || row.mrp === undefined || row.mrp === "") ? 0 : Number(row.mrp);
    const rating0 = Number(row.rating) || 0, reviews0 = Number(row.reviews) || 0;
    const pt = PT_MAP[row.pt] || PT_MAP.spares;
    const r = U.rng(name + "|" + idx);
    serial += 1 + Math.floor(r() * 4);
    const sku = row.sku || ("GF-" + cat.code + "-" + pt.id.replace(/[^a-z]/g, "").slice(0, 3).toUpperCase() + "-" + String(serial).padStart(4, "0"));
    const nl = name.toLowerCase();
    let bFor = (row.brands || []).map(b => String(b).toLowerCase().replace(/[^a-z0-9]/g, "")).filter(b => BRAND_MAP[b]);
    if (!bFor.length) bFor = BRANDS.filter(b => b.id.length > 3 && nl.includes(b.id)).map(b => b.id);
    if (!bFor.length) bFor = [...cat.brands].sort(() => r() - .5).slice(0, 2 + Math.floor(r() * 3));
    const mrp = (price !== null && mrp0 > price) ? mrp0 : price;
    const off = (price !== null && mrp !== null && mrp > price) ? Math.round((1 - price / mrp) * 100) : 0;
    const rating = rating0 > 0 ? Math.round(rating0 * 10) / 10 : Math.round((3.8 + r() * 1.1) * 10) / 10;
    const reviews = reviews0 > 0 ? reviews0 : 4 + Math.floor(r() * 210);
    const stock = Math.max(0, parseInt(row.stock, 10) || 0);
    const compat = [];
    bFor.forEach(bid => { (DB.models[bid + "|" + cat.id] || []).forEach(code => { if (r() > .3) compat.push(code); }); });
    const p = {
      sku, cat: cat.id, pt: pt.id,
      name: name, short: name,
      brandFor: bFor, price, mrp, off,
      rating, reviews, stock,
      isNew: row.isNew || r() < .14,
      isBest: row.isBest || (rating0 >= 4.2 && reviews0 >= 3) || r() < .07,
      isFeat: row.isFeat || r() < .1,
      por: price === null,
      unit: row.unit || "piece", size: row.size || "", pack: row.pack || "",
      colours: row.colours || "", material: row.material || "",
      note: row.note || "", group: row.group || "",
      sold: 40 + Math.floor(r() * 2600),
      art: pt.art, hue: cat.hue, seed: name + "|" + idx,
      img: row.img || "",
      gallery: Array.isArray(row.imgs) ? row.imgs : [],
      variants: Array.isArray(row.variants) ? row.variants.filter(v => v && v.label).map(v => ({
        label: String(v.label),
        price: (v.price === null || v.price === undefined || v.price === "") ? null : Number(v.price)
      })) : [],
      warranty: row.warranty || ["3 months", "6 months", "6 months", "12 months"][Math.floor(r() * 4)],
      weight: row.weight || (0.05 + r() * 1.8).toFixed(2) + " kg",
      compat,
      install: ["Easy — DIY", "Moderate — some tools", "Pro recommended"][Math.floor(r() * 3)],
      qa: [Math.floor(r() * QA_POOL.length), (1 + Math.floor(r() * (QA_POOL.length - 1)))],
      revSeed: Math.floor(r() * 1000)
    };
    if (p.variants.length){
      // the card shows the lowest size price; each size keeps its own price
      const vp = p.variants.map(v => v.price).filter(x => x !== null);
      p.price = vp.length ? Math.min(...vp) : null;
      p.mrp = p.price; p.off = 0; p.por = p.price === null;
      p.fromPrice = new Set(vp).size > 1;
    }
    DB.products.push(p); DB.prodMap[sku] = p;
  });
  // Size options: each size is a hidden entry with its own SKU and price, so the
  // cart, checkout and orders work exactly as for any product. They are kept out
  // of DB.products, so grids and search show only the parent product.
  DB.products.forEach(p => {
    (p.variants || []).forEach(v => {
      // unique per product even if two labels differ only in punctuation ("10 mm" / "10-mm")
      const base = p.sku + "~" + (v.label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "size");
      let vsku = base, n = 2;
      while (DB.prodMap[vsku]) vsku = base + "-" + (n++);
      v.sku = vsku;
      DB.prodMap[vsku] = Object.assign({}, p, {
        sku: vsku, parent: p.sku, variant: v.label,
        name: p.name + " — " + v.label, short: p.short + " — " + v.label,
        price: v.price, mrp: v.price, off: 0, por: v.price === null,
        variants: [], fromPrice: false
      });
    });
  });
  // A saved cart can hold a product or size that was since removed in the admin.
  // Only prune when the live catalogue answered — never against the offline copy.
  if (typeof GFLO !== "undefined" && GFLO.live && typeof State !== "undefined"){
    const before = State.cart.length;
    State.cart = State.cart.filter(i => i && DB.prodMap[i.sku]);
    if (State.cart.length !== before) U.store.set("cart", State.cart);
    // coupons switched off in the admin, or a code saved by an older version of the shop
    if (State.coupon && (!GFLO.coupons || !State.coupon.kind)){ State.coupon = null; U.store.set("coupon", null); }
  }
  // derive each category's part families from the real catalog
  CATS.forEach(c => {
    const counts = {};
    DB.products.forEach(p => { if (p.cat === c.id) counts[p.pt] = (counts[p.pt] || 0) + 1; });
    c.pts = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  });
  // categories with nothing in them are hidden from the storefront
  CATS.forEach(c => { c.count = DB.products.filter(p => p.cat === c.id).length; });
}
function prodArt(p, label){ return artFor(p.art, p.hue, p.seed, label || p.name); }
function catOf(p){ return CAT_MAP[p.cat]; }
function ptOf(p){ return PT_MAP[p.pt]; }
function brandNames(p, max){ return p.brandFor.slice(0, max || 3).map(b => BRAND_MAP[b].name).join(", "); }
function deliveryEta(pin){ const d = 3 + (U.hash(String(pin || "560001")) % 4); const dt = new Date(Date.now() + d * 864e5); return { days: d, label: dt.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" }) }; }

/* ================= STATE ================= */
const State = {
  cart: U.store.get("cart", []), wish: U.store.get("wish", []), cmp: U.store.get("cmp", []),
  orders: U.store.get("orders", []), recent: U.store.get("recent", []), pin: U.store.get("pin", "560001"),
  role: U.store.get("role", "admin"), coupon: U.store.get("coupon", null), news: U.store.get("news", false),
  user: U.store.get("user", null),
  save(){ ["cart","wish","cmp","orders","recent","pin","role","coupon","news","user"].forEach(k => U.store.set(k, this[k])); syncBadges(); if (typeof syncAuth === "function") syncAuth(); },
  login(email, via){
    const local = (email || "").split("@")[0].replace(/[._]+/g, " ").trim();
    const name = local ? local.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ") : "G-FLO Member";
    this.user = { email: email, name: name, via: via || "email", hue: U.hash(email || "g") % 360, since: Date.now() };
    this.save();
  },
  logout(){ this.user = null; this.save(); },
  inCart(sku){ return this.cart.find(i => i.sku === sku); },
  addCart(sku, qty, silent){
    const p = DB.prodMap[sku]; if (!p) return;
    if (p.variants && p.variants.length){           // must pick a size first
      if (!silent) toast("Please choose a size", "info");
      if (Router.parse().page !== "product") Router.push("/p/" + p.sku);
      return;
    }
    if (p.stock === 0){ toast("This part is out of stock", "warn"); return; }
    const it = this.inCart(sku);
    if (it) it.qty = U.clamp(it.qty + (qty || 1), 1, 99); else this.cart.push({ sku, qty: qty || 1 });
    this.save();
    if (!silent){ toast("Added to cart — " + p.short); renderCartDrawer(); openDrawer("cart-drawer"); }
  },
  setQty(sku, qty){
    const it = this.inCart(sku); if (!it) return;
    /* was clamped to 0..99 with no reference to stock, so the + stepper happily
       took a part with 25 in stock up to 99 and still said "In stock" */
    const p = DB.prodMap[sku];
    const ceiling = Math.max(1, Math.min(99, (p && Number.isFinite(p.stock) && p.stock > 0) ? p.stock : 99));
    const want = Math.floor(Number(qty) || 0);
    it.qty = U.clamp(want, 0, ceiling);
    if (want > ceiling) toast("Only " + ceiling + " in stock", "warn");
    if (it.qty === 0) this.cart = this.cart.filter(i => i.sku !== sku);
    this.save();
  },
  rmCart(sku){ this.cart = this.cart.filter(i => i.sku !== sku); this.save(); },
  cartTotals(){
    let sub = 0, mrp = 0, count = 0;
    let quote = 0;
    this.cart.forEach(i => { const p = DB.prodMap[i.sku]; if (!p) return;
      if (p.price === null){ quote += i.qty; } else { sub += p.price * i.qty; mrp += (p.mrp === null ? p.price : p.mrp) * i.qty; }
      count += i.qty; });
    /* coupon rules come from the server (Admin -> Coupons); the same maths runs
       there when the order is placed, so the cart total is the order total */
    let disc = 0, freeShip = false; const c = this.coupon;
    if (c && c.kind && typeof GFLO !== "undefined" && GFLO.coupons && sub >= (c.min || 0)){
      if (c.kind === "pct"){ disc = Math.round(sub * (c.value || 0) / 100); if (c.max) disc = Math.min(disc, c.max); }
      else if (c.kind === "flat") disc = c.value || 0;
      else if (c.kind === "ship") freeShip = true;
      disc = Math.max(0, Math.min(disc, sub));
    }
    const afterDisc = sub - disc;
    const ship = freeShip || afterDisc >= 4999 || count === 0 ? 0 : 99;
    const gst = Math.round(afterDisc * .18);
    return { sub, mrp, saveMrp: mrp - sub, disc, freeShip, ship, gst, total: afterDisc + ship, count, quote,
             freeGap: Math.max(0, 4999 - afterDisc) };
  },
  toggleWish(sku){ const i = this.wish.indexOf(sku); if (i >= 0){ this.wish.splice(i, 1); toast("Removed from wishlist", "info"); } else { this.wish.push(sku); toast("Saved to wishlist ♥"); } this.save(); },
  toggleCmp(sku){
    const i = this.cmp.indexOf(sku);
    if (i >= 0){ this.cmp.splice(i, 1); }
    else { if (this.cmp.length >= 4){ toast("Compare holds up to 4 parts", "warn"); return; } this.cmp.push(sku); toast("Added to compare"); }
    this.save();
  },
  pushRecent(sku){ this.recent = [sku, ...this.recent.filter(s => s !== sku)].slice(0, 12); this.save(); },
  placeOrder(payload){
    const id = "GFLO" + String(100000 + Math.floor(Math.random() * 900000));
    const t = this.cartTotals();
    const order = { id, ts: Date.now(), items: this.cart.map(i => ({ ...i })), totals: t, ...payload, status: 1 };
    this.orders.unshift(order); this.cart = []; this.coupon = null; this.save();
    return order;
  }
};

/* ================= OVERLAYS: toast / drawer / modal ================= */
function toast(msg, type){
  const wrap = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  el.innerHTML = U.icon(type === "err" ? "alert" : type === "warn" ? "alert" : type === "info" ? "info" : "check") + `<span>${U.esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 350); }, 2600);
}
let lastFocus = null;
function openDrawer(id){
  const d = document.getElementById(id); if (!d) return;
  lastFocus = document.activeElement;
  document.getElementById("ovl-bg").classList.add("open");
  d.classList.add("open"); d.setAttribute("aria-hidden", "false");
  const f = d.querySelector("button,a,input,select"); if (f) f.focus();
}
function closeOverlays(){
  document.querySelectorAll(".drawer.open,.modal-wr.open,.chat.open").forEach(e => { e.classList.remove("open"); e.setAttribute("aria-hidden", "true"); });
  document.getElementById("ovl-bg").classList.remove("open");
  document.querySelectorAll(".mega.open").forEach(m => m.classList.remove("open"));
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function modal(html, opts){
  const wr = document.getElementById("modal-wr");
  wr.querySelector(".modal").className = "modal" + (opts && opts.wide ? " wide" : "");

/* ================= SEARCH ENGINE ================= */
const Search = {
  tokens(q){ return U.slug(q).split("-").filter(Boolean); },
  intent(q){
    const toks = this.tokens(q);
    const it = { brand: null, cat: null, pt: null, maxPrice: null, model: null, terms: [] };
    const mm = q.match(/\b([A-Za-z]{2}-[A-Z]{2}\d{3}[A-Z])\b/i);
    if (mm) it.model = mm[1].toUpperCase();
    const um = q.toLowerCase().match(/under\s*₹?\s*(\d{2,6})|below\s*₹?\s*(\d{2,6})|<\s*(\d{2,6})/);
    if (um) it.maxPrice = +(um[1] || um[2] || um[3]);
    toks.forEach(t => {
      if (!it.brand){ const b = BRANDS.find(b => U.slug(b.name) === t || U.slug(b.name).startsWith(t) && t.length > 3); if (b){ it.brand = b.id; return; } }
      it.terms.push(t);
    });
    const joined = toks.join(" ");
    CATS.forEach(c => { const s = U.slug(c.name).split("-"); if (s.every(w => joined.includes(w))) it.cat = it.cat || c.id; });
    if (!it.cat){ CATS.forEach(c => { const s = U.slug(c.name).split("-"); if (s.some(w => w.length > 3 && joined.includes(w))) it.cat = it.cat || c.id; }); }
    PT.forEach(p => { const s = U.slug(p.name).replace(/s$/, ""); if (toks.some(t => s.includes(t.replace(/s$/, "")) && t.length > 3)) it.pt = it.pt || p.id; });
    return it;
  },
  score(p, toks, it){
    let s = 0, hits = 0, wordHits = 0;
    const hay = U.slug(p.name + " " + p.sku + " " + catOf(p).name + " " + ptOf(p).name + " " + brandNames(p, 6));
    const name = U.slug(p.name);
    /* Tokens of one or two characters must match a WHOLE word. As a substring,
       "a" appeared in almost every part and returned 500 of 700 results, and
       "or" matched inside "motor" and "cover" for 132. Three characters and up
       keep substring matching, which is what the earlier relevance work tuned. */
    const hayWords = hay.split("-"), nameWords = name.split("-");
    toks.forEach(t => {
      const inHay = t.length <= 2 ? hayWords.includes(t) : hay.includes(t);
      const inName = t.length <= 2 ? nameWords.includes(t) : name.includes(t);
      if (inHay) { s += t.length > 3 ? 3 : 1.5; hits++; wordHits++; }
      if (inName) s += 2;                    // a hit in the part's own name counts for more
    });
    /* every word of a multi-word query is present -> almost certainly what they meant */
    if (toks.length > 1 && wordHits === toks.length) s += 5;
    if (it.cat && p.cat === it.cat) { s += 6; hits++; }
    if (it.pt && p.pt === it.pt) { s += 6; hits++; }
    if (it.brand && p.brandFor.includes(it.brand)) { s += 5; hits++; }
    if (it.model && p.compat.includes(it.model)) { s += 10; hits++; }
    /* Nothing about this part matched the query, so it is not a result.
       This guard is the important bit: the popularity bonus below is worth up
       to ~4.5 points on its own, which used to clear the "s > 3" cut-off all by
       itself — so a search for "spring" returned 443 of 896 products, ranked by
       how well they sell rather than by whether they were springs. */
    if (!hits) return 0;
    if (it.maxPrice && p.price <= it.maxPrice) s += 2;
    if (it.maxPrice && p.price > it.maxPrice) s -= 8;
    /* popularity only ever breaks ties between genuine matches */
    s += p.rating / 2 + Math.min(2, p.sold / 1500);
    return s;
  },
  query(q, limit){
    const toks = this.tokens(q); if (!toks.length) return { items: [], intent: {} };
    const it = this.intent(q);
    const scored = [];
    DB.products.forEach(p => { const s = this.score(p, toks, it); if (s > 3) scored.push([s, p]); });
    scored.sort((a, b) => b[0] - a[0]);
    return { items: scored.slice(0, limit || 24).map(x => x[1]), intent: it };
  },
  suggest(q){
    const it = this.intent(q);
    const res = this.query(q, 5);
    const toks = this.tokens(q);
    const cats = CATS.filter(c => toks.some(t => U.slug(c.name).includes(t))).slice(0, 3);
    const brands = BRANDS.filter(b => toks.some(t => U.slug(b.name).includes(t) && t.length > 2)).slice(0, 3);
    const pts = PT.filter(p => toks.some(t => U.slug(p.name).includes(t) && t.length > 3)).slice(0, 3);
    return { products: res.items, cats, brands, pts, intent: it };
  }
};

/* ================= AI HELPERS ================= */
const AI = {
  intentLabel(it){
    const bits = [];
    if (it.brand) bits.push("brand: " + BRAND_MAP[it.brand].name);
    if (it.cat) bits.push("appliance: " + CAT_MAP[it.cat].name);
    if (it.pt) bits.push("part: " + PT_MAP[it.pt].name);
    if (it.model) bits.push("model: " + it.model);
    if (it.maxPrice) bits.push("budget: under ₹" + it.maxPrice);
    return bits.join(" · ");
  },
  detectFromFile(name, size){
    const r = U.rng(name + size);
    const cat = CATS[Math.floor(r() * CATS.length)];
    const lower = (name || "").toLowerCase();
    const hit = CATS.find(c => lower.includes(c.id.split("-")[0])) || cat;
    const pts = hit.pts.slice(0, 3 + Math.floor(r() * 3)).map(id => PT_MAP[id]);
    const conf = 82 + Math.floor(r() * 16);
    return { cat: hit, pts, conf };
  },
  ocrFromFile(name, size){
    const r = U.rng("ocr" + name + size);
    const m = DB.modelList[Math.floor(r() * DB.modelList.length)];
    const lower = (name || "").toLowerCase();
    const catHit = CATS.find(c => lower.includes(c.id.split("-")[0]));
    const pick = catHit ? DB.modelList.find(x => x.cat === catHit.id) || m : m;
    return { model: pick, conf: 88 + Math.floor(r() * 11), serial: "SN" + String(Math.floor(r() * 9e7 + 1e7)) };
  },
  compatCheck(p, brandId, model){
    if (!model) return { ok: false, msg: "Enter your model number to verify." };
    const M = model.toUpperCase().trim();
    if (p.compat.includes(M)) return { ok: true, msg: `Verified fit — ${M} is in the fitment list for this part.` };
    const near = p.compat.filter(c => !brandId || c.startsWith((BRAND_MAP[brandId] ? BRAND_MAP[brandId].name.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() : ""))).slice(0, 3);
    const alt = DB.products.find(x => x.cat === p.cat && x.pt === p.pt && x.compat.includes(M));
    return { ok: false, msg: `${M} isn't in this part's verified list.`, near, alt };
  },
  recsFor(p, n){
    return DB.products.filter(x => x.sku !== p.sku && (x.cat === p.cat || x.pt === p.pt))
      .sort((a, b) => (b.cat === p.cat ? 1 : 0) - (a.cat === p.cat ? 1 : 0) || b.rating - a.rating).slice(0, n || 8);
  },
  smartPicks(n){
    const seen = State.recent.map(s => DB.prodMap[s]).filter(Boolean);
    if (!seen.length) return DB.products.filter(p => p.isBest).slice(0, n || 8);
    const cats = [...new Set(seen.map(p => p.cat))];
    return DB.products.filter(p => cats.includes(p.cat) && !State.recent.includes(p.sku)).sort((a, b) => b.rating - a.rating).slice(0, n || 8);
  }
};

/* ================= ROUTER ================= */
const Pages = {}, Mount = {};
/* ============ two-hostname split (brand site vs shop) ============
   The server injects window.GFLO_HOSTS = {main, store} when SITE_HOST and
   STORE_HOST are both configured. Shop pages then live on the store hostname
   and brand pages on the main one, and asking the wrong host for a page sends
   you to the right one — so neither hostname serves the other's pages and
   Google does not see the catalogue duplicated across two domains.
   With no config injected, everything below is inert and the site stays
   single-host exactly as before.                                          */
const HOSTS = (typeof window !== "undefined" && window.GFLO_HOSTS) || null;
const SHOP_PAGES = ["categories", "category", "brands", "brand", "deals", "search",
                    "product", "finder", "cart", "checkout", "order", "wishlist", "account", "track"];
function hostFor(page){
  if (!HOSTS) return null;
  /* "home" is the brand page — but store.example.com/ with a bare path also
     parses as "home", and bouncing that to the brand site made the shop
     hostname impossible to open. On the shop host, a bare root stays put. */
  if (page === "home" && location.hostname === HOSTS.store) return HOSTS.store;
  return SHOP_PAGES.indexOf(page) >= 0 ? HOSTS.store : HOSTS.main;
}
function onWrongHost(page){
  if (!HOSTS) return false;
  const want = hostFor(page);
  return want && location.hostname !== want;
}
/* which page a "/..." link resolves to, so a link can be pointed at the right host */
function pageOfPath(path){
  const seg = String(path || "").replace(/^#/, "").replace(/^\//, "").split(/[/?#]/)[0];
  const m = { "": "home", categories: "categories", c: "category", brands: "brands", b: "brand",
              deals: "deals", search: "search", p: "product", finder: "finder", guides: "guides",
              g: "guide", support: "support", account: "account", cart: "cart", checkout: "checkout",
              order: "order", wishlist: "wishlist", about: "about", contact: "contact", policy: "policy" };
  return m[seg] || "home";
}
/* a "#/..." link rewritten to the hostname that owns it (unchanged when single-host) */
function hostedLink(path){ return hostedHref(pageOfPath(path), path); }

/* absolute link to a route on whichever hostname owns it */
function hostedHref(page, path){
  if (!HOSTS) return path;
  const want = hostFor(page);
  if (!want || location.hostname === want) return path;
  return "https://" + want + (path.charAt(0) === "/" ? path : "/" + path);
}

const Router = {
  parse(){
    /* Routes are real paths now ("/categories"), not fragments ("#/categories"),
       so the address bar carries no "#" and every page has its own URL that a
       search engine and a link preview can actually see. */
    let h = location.pathname.replace(/^\//, "").replace(/\/$/, "");
    /* "/search?q=fan" is the shape people bookmark and share, but this app's
       own links use "/search/fan", so the query-string form fell through to
       the not-found page. Accept it as an alias. */
    const term = new URLSearchParams(location.search).get("q");
    if (term && h.replace(/\/.*$/, "") === "search") h = "search/" + term;
    const seg = h.split("/").map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
    const map = { "": ["home"], categories: ["categories"], c: ["category", seg[1]], brands: ["brands"], b: ["brand", seg[1]], deals: ["deals"], search: ["search", seg.slice(1).join("/")], p: ["product", seg[1]], finder: ["finder", seg[1]], guides: ["guides"], g: ["guide", seg[1]], support: ["support"], account: ["account", seg[1]], cart: ["cart"], checkout: ["checkout"], order: ["order", seg[1]], wishlist: ["wishlist"], seller: ["seller", seg[1]], admin: ["admin", seg[1]], about: ["about"], contact: ["contact"], policy: ["policy", seg[1]], track: ["track"], login: ["account", "overview"] };  /* no customer sign-in — #/login lands on the account page */
    /* the shop hostname's bare root opens the catalogue, not the brand home */
    if (!h && HOSTS && location.hostname === HOSTS.store) return { page: "categories" };
    const m = map[seg[0]] || ["notfound"];
    return { page: m[0], param: m[1] };
  },
  titles: {
    home: "G-FLO — Genuine Appliance Spare Parts", categories: "All Categories — G-FLO", brands: "Shop by Brand — G-FLO",
    deals: "Deals & Offers — G-FLO", finder: "AI Spare Part Finder — G-FLO", guides: "Repair Guides — G-FLO",
    support: "Help & Support — G-FLO", account: "My Account — G-FLO", track: "Track your order — G-FLO",
    cart: "Cart — G-FLO", checkout: "Checkout — G-FLO", wishlist: "Wishlist — G-FLO",
    seller: "Sell on G-FLO — G-FLO", admin: "Staff sign-in — G-FLO", about: "About Us — G-FLO", contact: "Contact — G-FLO", policy: "Store Policies — G-FLO"
  },
  /* Navigate without a page load. Replaces the old "location.hash = ..." */
  push(path, replace){
    const url = String(path || "/");
    if (url.charAt(0) !== "/"){ location.href = url; return; }   /* absolute/cross-host */
    if (url === location.pathname + location.search){ this.go(); return; }
    try { history[replace ? "replaceState" : "pushState"]({}, "", url); }
    catch (e) { location.href = url; return; }                   /* file:// etc. */
    this.go();
  },
  /* An old shared or bookmarked "#/c/ceiling-fan" link still has to work, so
     rewrite it to the clean path once, before the first render. */
  upgradeLegacyHash(){
    const h = location.hash;
    if (!h || h.indexOf("#/") !== 0) return false;
    const clean = h.slice(1) || "/";
    try { history.replaceState({}, "", clean); return true; }
    catch (e) { return false; }
  },
  go(){
    closeOverlays();
    const { page, param } = this.parse();
    if (onWrongHost(page)){
      location.replace("https://" + hostFor(page) + location.pathname + location.search);
      return;
    }
    const app = document.getElementById("app");
    const fn = Pages[page] || Pages.notfound;
    app.innerHTML = `<div class="pg" id="pg-${page}">${fn(param)}</div>`;
    let t = this.titles[page] || "G-FLO";
    if (page === "product" && DB.prodMap[param]) t = DB.prodMap[param].short + (typeof CATALOG_MODE !== "undefined" && CATALOG_MODE ? "" : " | " + U.inr(DB.prodMap[param].price)) + " — G-FLO";
    if (page === "category" && CAT_MAP[param]) t = CAT_MAP[param].name + " Spare Parts — G-FLO";
    if (page === "brand" && BRAND_MAP[param]) t = BRAND_MAP[param].name + " Spare Parts — G-FLO";
    document.title = t;
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    if (Mount[page]) Mount[page](param);
    revealInit(app);
    syncNav(page);
    if (typeof renderFooter === "function") renderFooter(page);
    document.body.classList.toggle("brand-page", page === "home");
    document.body.classList.toggle("checkout-page", page === "checkout");
    app.focus({ preventScroll: true });
  }
};
function revealInit(root){
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .08 });
  (root || document).querySelectorAll(".rv:not(.in)").forEach(el => io.observe(el));
}
function syncNav(page){
  document.querySelectorAll("[data-nav]").forEach(a => {
    const k = a.getAttribute("data-nav");
    a.classList.toggle("on", k === page || (k === "home" && page === "home"));
  });
}
function syncBadges(){
  const t = State.cartTotals();
  document.querySelectorAll("[data-badge=cart]").forEach(e => { e.textContent = t.count; e.style.display = t.count ? "grid" : "none"; });
  document.querySelectorAll("[data-badge=wish]").forEach(e => { e.textContent = State.wish.length; e.style.display = State.wish.length ? "grid" : "none"; });
  document.querySelectorAll("[data-cart-total]").forEach(e => { e.textContent = t.count ? (CATALOG_MODE ? t.count + " item" + (t.count > 1 ? "s" : "") : U.inr(t.total)) : "Cart"; });
}

const USER_PT_IMG = { "capacitor": "capacitor", "bearing": "bearing", "fan-blade": "blades", "body": "canopyset", "shaft": "shaft", "field-coil": "winding", "armature": "winding", "motor": "winding", "screw-kit": "screws", "spring": "spring", "power-cord": "harness", "clip-kit": "hooks", "hinge": "hooks" };
let __fanRep = null;
function fanRep(){
  if (__fanRep) return __fanRep;
  __fanRep = {};
  DB.products.forEach(p => {
    if ((p.cat === "ceiling-fan" || p.cat === "table-fan") && USER_PT_IMG[p.pt]){
      const k = p.cat + "|" + p.pt;
      if (!__fanRep[k] || p.rating > DB.prodMap[__fanRep[k]].rating) __fanRep[k] = p.sku;
    }
  });
  return __fanRep;
}
/* Every REAL photograph we have for a product, in display order.
   The gallery is built from this list, so a product with two photos shows two
   thumbnails — it no longer pads the strip out to four with generated
   illustrations ("Angle" / "Schematic") sitting next to the real pictures. */
function prodPhotoUrls(p){
  const out = [];
  const push = u => { if (u && out.indexOf(u) === -1) out.push(u); };
  if ((p.cat === "ceiling-fan" || p.cat === "table-fan") && USER_PT_IMG[p.pt] && typeof USER_IMGS !== "undefined" && fanRep()[p.cat + "|" + p.pt] === p.sku) push(USER_IMGS[USER_PT_IMG[p.pt]]);
  push(p.img);
  (p.gallery || p.imgs || []).forEach(push);    // extra photos (admin uploads + CSV "gallery")
  if (!out.length){
    const list = PHOTOS[p.cat + "|" + p.pt];    // shared stock photo for the part type
    if (list && list.length) push(list[U.hash(p.sku) % list.length]);
