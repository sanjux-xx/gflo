let __fanRep = null;
function fanRep(){
  if (__fanRep) return __fanRep;
  __fanRep = {};
  DB.products.forEach(p => {
    if ((p.cat === "ceiling-fan" || p.cat === "table-fan") && USER_PT_IMG[p.pt]){
      const k = p.cat + "|" + p.pt;
      if (!__fanRep[k] || p.rating > DB.prodMap[__fanRep[k]].rating) __fanRep[k] = p.sku;
    }
  });
  return __fanRep;
}
function prodMediaIdx(p, idx, label){
  const svg = artFor(p.art, p.hue, p.seed + (idx ? "|t" + idx : ""), label || p.name);
  let url = "";
  if ((p.cat === "ceiling-fan" || p.cat === "table-fan") && USER_PT_IMG[p.pt] && typeof USER_IMGS !== "undefined" && fanRep()[p.cat + "|" + p.pt] === p.sku) url = USER_IMGS[USER_PT_IMG[p.pt]] || "";
  if (!url) url = p.img || "";
  if (!url){
    const list = PHOTOS[p.cat + "|" + p.pt];
    if (list && list.length) url = list[(U.hash(p.sku) + (idx || 0)) % list.length];
  }
  if (!url || idx >= 2) return `<span class="pm">${svg}</span>`;
  return `<span class="pm${idx === 1 ? " pm-crop" : ""}">${svg}<img src="${U.esc(url)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()"></span>`;
}
