<script>
"use strict";
/* ================= CHART HELPERS (inline SVG) ================= */
function svgArea(data, w, h, color){
  w = w || 560; h = h || 180;
  const max = Math.max(...data) * 1.15, step = w / (data.length - 1);
  const pts = data.map((v, i) => [i * step, h - v / max * (h - 22) - 6]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Trend chart">
    <defs><linearGradient id="ga${w}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color || "#ec3338"}" stop-opacity=".35"/><stop offset="1" stop-color="${color || "#ec3338"}" stop-opacity="0"/></linearGradient></defs>
    ${[.25, .5, .75].map(f => `<line x1="0" y1="${h * f}" x2="${w}" y2="${h * f}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>`).join("")}
    <path d="${line} L ${w} ${h} L 0 ${h} Z" fill="url(#ga${w})"/>
    <path d="${line}" fill="none" stroke="${color || "#ec3338"}" stroke-width="2.5" stroke-linecap="round"/>
    ${pts.filter((_, i) => i % 5 === 0 || i === pts.length - 1).map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color || "#ec3338"}"/>`).join("")}
  </svg>`;
}
function svgBars(pairs, color){
  const w = 560, h = 190, max = Math.max(...pairs.map(p => p[1])) * 1.12, bw = w / pairs.length;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Bar chart">
    ${pairs.map((p, i) => { const bh = p[1] / max * (h - 40); return `<rect x="${(i * bw + bw * .18).toFixed(1)}" y="${(h - 24 - bh).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${bh.toFixed(1)}" rx="6" fill="${color || "#f59e0b"}" opacity="${.55 + .45 * (p[1] / max)}"/><text x="${(i * bw + bw / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10.5" fill="var(--tx3)" font-family="Inter">${U.esc(p[0])}</text>`; }).join("")}
  </svg>`;
}
function svgDonut(segs){
  const tot = segs.reduce((s, x) => s + x[1], 0); let acc = 0;
  const arcs = segs.map(s => {
    const a0 = acc / tot * Math.PI * 2 - Math.PI / 2; acc += s[1];
    const a1 = acc / tot * Math.PI * 2 - Math.PI / 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = a => [70 + 52 * Math.cos(a), 70 + 52 * Math.sin(a)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A 52 52 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${s[2]}" stroke-width="17" stroke-linecap="butt"/>`;
  }).join("");
  return `<svg viewBox="0 0 140 140" style="max-width:150px" role="img" aria-label="Share chart">${arcs}<text x="70" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="var(--tx)" font-family="Space Grotesk">${tot.toLocaleString("en-IN")}</text><text x="70" y="83" text-anchor="middle" font-size="9.5" fill="var(--tx3)" font-family="Inter">orders</text></svg>`;
}
function stChip(s){
  const M = { Delivered: "b-ok", Shipped: "b-info", Packed: "b-best", New: "b-brand", Cancelled: "b-off", Returned: "b-deal", Refunded: "b-info", Open: "b-deal", Resolved: "b-ok", Pending: "b-best", Active: "b-ok", Paused: "b-off", Low: "b-low" };
  return `<span class="st-chip ${M[s] || "b-info"}">${s}</span>`;
}

  const cities = ["Bengaluru", "Mumbai", "Delhi", "Pune", "Hyderabad", "Chennai", "Jaipur", "Kolkata", "Indore", "Kochi"];
  const sts = ["New", "Packed", "Shipped", "Delivered", "Delivered", "Delivered", "Returned", "Cancelled"];
  const orders = Array.from({ length: 26 }, (_, i) => {
    const p = DB.products[Math.floor(r() * DB.products.length)]
      || { sku: "GF-0000", short: "Sample part", name: "Sample part", price: 0, mrp: 0, cat: CATS[0].id, pt: "spares", art: "spares", hue: 210, seed: "x" };
    const qty = 1 + Math.floor(r() * 3);
    return { id: "GFLO" + (982150 - i * 7), who: U.pick(names, r), city: U.pick(cities, r), p, qty, amt: (p.price || 0) * qty, st: sts[Math.floor(r() * sts.length)], date: new Date(Date.now() - i * 864e5 * .7), pay: U.pick(["UPI", "Card", "COD", "NB"], r) };
  });
  const rev14 = Array.from({ length: 14 }, () => Math.round(38000 + r() * 92000));
  const ord14 = rev14.map(v => Math.round(v / 1450));
  const coupons = [
    { code: "GFLO10", type: "10% off above ₹999", used: 1240, cap: 5000, st: "Active" },
    { code: "FLAT100", type: "₹100 off above ₹599", used: 3480, cap: 10000, st: "Active" },
    { code: "FREESHIP", type: "Free delivery", used: 8921, cap: 0, st: "Active" },
    { code: "MONSOON25", type: "25% off pumps & seals", used: 4970, cap: 5000, st: "Paused" }
  ];
  const tickets = [
    { id: "TKT-4312", who: "Rahul Jain", sub: "Wrong coupler size received", pr: "High", st: "Open", age: "2h" },
    { id: "TKT-4309", who: "Meena Iyer", sub: "Need GST invoice re-issued", pr: "Low", st: "Pending", age: "6h" },
    { id: "TKT-4301", who: "Farhan Ali", sub: "Refund not credited yet", pr: "High", st: "Open", age: "1d" },
    { id: "TKT-4287", who: "Priya Nair", sub: "Install engineer rescheduling", pr: "Med", st: "Resolved", age: "2d" },
    { id: "TKT-4275", who: "Vikram Patil", sub: "Bulk pricing for 40 capacitors", pr: "Med", st: "Pending", age: "3d" }
  ];
  const returns = orders.filter(o => o.st === "Returned").map((o, i) => ({ ...o, reason: U.pick(["Doesn't fit model", "Damaged in transit", "Ordered wrong part"], r), stage: U.pick(["Pickup scheduled", "In QC", "Refunded"], r) }));
  const sellers = [
    { name: "G-FLO Certified", sku: 412, rating: 4.8, fulfil: "99.1%", gmv: "₹42.6L" },
    { name: "VoltEdge Spares", sku: 187, rating: 4.6, fulfil: "97.4%", gmv: "₹18.2L" },
    { name: "Coil & Core Co.", sku: 121, rating: 4.5, fulfil: "96.8%", gmv: "₹11.9L" },
    { name: "Meru Parts Hub", sku: 86, rating: 4.3, fulfil: "94.2%", gmv: "₹6.4L" }
  ];
  return { orders, rev14, ord14, coupons, tickets, returns, sellers, names, cities };
}
Object.defineProperty(globalThis, "DASH", {
  get(){ if (!_DASH) _DASH = buildDash(); return _DASH; }
});

/* ================= ROLE-BASED ACCESS ================= */
const ROLES = { admin: { label: "Admin", can: ["overview", "orders", "inventory", "coupons", "shipping", "invoices", "support", "returns", "reports", "sellers", "customers", "roles"] }, manager: { label: "Ops Manager", can: ["overview", "orders", "inventory", "coupons", "shipping", "returns", "support"] }, support: { label: "Support Agent", can: ["overview", "orders", "support", "returns"] } };
function roleCan(tab){ return (ROLES[State.role] || ROLES.admin).can.includes(tab); }
function rolePill(){
  return `<div class="role-pill" role="group" aria-label="Simulate role">${Object.keys(ROLES).map(k => `<button data-role="${k}" class="${State.role === k ? "on" : ""}">${ROLES[k].label}</button>`).join("")}</div>`;
}
function lockedPanel(need){
  return `<div class="panel"><div class="lock-note">${U.icon("shield")} Your simulated role (<b>${ROLES[State.role].label}</b>) can't access <b>${need}</b>. Switch to Admin to view — this demonstrates role-based access control.</div></div>`;
}

/* ================= SELLER STUDIO ================= */
Pages.seller = tab => dashPage("seller", tab || "overview");
Mount.seller = tab => dashMount("seller", tab || "overview");
/* The demo admin console is gone — the real one is the password-protected
   Python admin site at /admin. Anyone hitting #/admin is sent there.   */
Pages.admin = () => `<div class="wrap" style="padding:60px 0;text-align:center"><h2>Staff sign-in</h2><p class="mut" style="margin:10px 0 18px">Opening the admin console…</p><a class="btn btn-p" href="/admin/login">Go to admin sign-in</a></div>`;

}

      <div class="panel"><h3>Order mix</h3><div class="row" style="gap:20px;flex-wrap:wrap">${svgDonut([["Prepaid", 612, "#ec3338"], ["COD", 318, "#f59e0b"], ["B2B", 96, "#334155"]])}<div class="legend" style="flex-direction:column;align-items:flex-start"><span><i style="background:#ec3338"></i>Prepaid · 612</span><span><i style="background:#f59e0b"></i>COD · 318</span><span><i style="background:#334155"></i>B2B / GST · 96</span></div></div></div>

    return `<div class="panel"><div class="spread" style="margin-bottom:12px;flex-wrap:wrap;gap:10px"><h3 style="margin:0">Inventory <span class="mut3" style="font-size:12px;font-weight:500">· first 40 of ${DB.products.length} SKUs</span></h3><div class="row"><button class="btn btn-p btn-sm" onclick="toast('New SKU wizard is stubbed in the demo','info')">${U.icon("plus", "ic-s")} Add SKU</button><button class="btn btn-ghost btn-sm" data-export="inventory">${U.icon("download", "ic-s")} Export CSV</button></div></div>

    ${[["BlueDart Surface", "National", "38%", "97.1%", "1.1%", "Active"], ["Delhivery", "National", "31%", "95.8%", "1.6%", "Active"], ["DTDC", "South + West", "18%", "94.9%", "2.0%", "Active"], ["India Post", "ODA pincodes", "13%", "91.2%", "2.8%", "Active"]].map(rw => `<tr><td><b>${rw[0]}</b></td><td>${rw[1]}</td><td>${rw[2]}</td><td>${rw[3]}</td><td>${rw[4]}</td><td>${stChip(rw[5])}</td></tr>`).join("")}</table></div>

    ${DASH.sellers.map(s => `<tr><td><b>${s.name}</b></td><td>${s.sku}</td><td>★ ${s.rating}</td><td>${s.fulfil}</td><td>${s.gmv}</td><td><button class="btn btn-soft btn-sm" onclick="toast('Seller detail view is stubbed','info')">Manage</button></td></tr>`).join("")}</table></div></div>`;
  if (tab === "customers") return `<div class="panel"><h3>Customers</h3><div class="tbl-wr"><table class="tbl"><tr><th>Customer</th><th>City</th><th>Orders</th><th>LTV</th><th>Last seen</th></tr>
    ${DASH.names.slice(0, 9).map((n, i) => `<tr><td><div class="row"><span class="ava" style="width:30px;height:30px;font-size:12px;background:linear-gradient(135deg,hsl(${(i * 41) % 360} 60% 45%),hsl(${(i * 41 + 60) % 360} 65% 38%))">${n[0]}</span><b>${n}</b></div></td><td>${DASH.cities[i % DASH.cities.length]}</td><td>${2 + (i * 3) % 11}</td><td>${U.inr(1800 + i * 1240)}</td><td>${1 + i}d ago</td></tr>`).join("")}</table></div></div>`;
  if (tab === "roles") return `<div class="panel"><h3>Roles & access control</h3>
    <p class="mut" style="font-size:13.5px;margin-bottom:14px">Switch the simulated role (top right) and watch locked sections update across both dashboards.</p>
    <div class="tbl-wr"><table class="tbl"><tr><th>Capability</th>${Object.values(ROLES).map(r => `<th>${r.label}</th>`).join("")}</tr>
    ${["overview", "orders", "inventory", "coupons", "invoices", "support", "returns", "reports", "sellers", "customers", "roles"].map(cp => `<tr><td style="text-transform:capitalize">${cp}</td>${Object.keys(ROLES).map(k => `<td>${ROLES[k].can.includes(cp) ? `<span class="st-chip b-ok">Yes</span>` : `<span class="st-chip b-off">No</span>`}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
  return lockedPanel(tab);
}
function ordersTable(list){
  return `<div class="tbl-wr"><table class="tbl"><tr><th>Order</th><th>Customer</th><th>Item</th><th>Amount</th><th>Payment</th><th>Status</th><th>Date</th></tr>
  ${list.map(o => `<tr><td class="mono" style="font-size:11px">${o.id}</td><td><b>${o.who}</b><div class="mut3" style="font-size:11px">${o.city}</div></td><td style="max-width:220px"><div class="row" style="gap:8px"><span style="width:32px;height:32px;border-radius:8px;overflow:hidden;flex:none;background:var(--art-bg1)">${prodArt(o.p)}</span><span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(o.p.short)} × ${o.qty}</span></div></td><td><b>${U.inr(o.amt)}</b></td><td>${o.pay}</td><td>${stChip(o.st)}</td><td class="mut3" style="font-size:11.5px">${o.date.toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</td></tr>`).join("")}</table></div>`;
}
function dashMount(kind, tab){
  bindSearch("hd-q", "hd-sug");
  document.querySelectorAll("[data-role]").forEach(b => b.addEventListener("click", () => { State.role = b.getAttribute("data-role"); State.save(); toast("Viewing as " + ROLES[State.role].label, "info"); Router.go(); }));
  bindInvoiceButtons();
  document.querySelectorAll("[data-stock]").forEach(i => i.addEventListener("change", () => {
    const p = DB.prodMap[i.getAttribute("data-stock")]; if (!p) return;
    p.stock = Math.max(0, +i.value || 0); toast(`Stock updated — ${p.sku} → ${p.stock}`);
    const row = i.closest("tr"); const st = row.querySelector("td:nth-child(6)"); if (st) st.innerHTML = p.stock === 0 ? stChip("Paused") : p.stock <= 5 ? stChip("Low") : stChip("Active");
  }));
  document.querySelectorAll("[data-export]").forEach(b => b.addEventListener("click", () => {
    const kindE = b.getAttribute("data-export");
    let csv = "";
    if (kindE === "inventory") csv = "sku,name,category,price,stock\n" + DB.products.slice(0, 200).map(p => `${p.sku},"${p.short}",${p.cat},${p.price},${p.stock}`).join("\n");
    else csv = "order,customer,city,amount,status,date\n" + DASH.orders.map(o => `${o.id},"${o.who}",${o.city},${o.amt},${o.st},${o.date.toISOString().slice(0, 10)}`).join("\n");
    try {
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      const a = document.createElement("a"); a.href = url; a.download = "gflo-" + kindE + ".csv"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast("CSV export started");
    } catch(e){ modal(`<pre class="mono" style="white-space:pre-wrap;font-size:11.5px">${U.esc(csv.slice(0, 1800))}</pre>`, { title: "Export preview" }); }
  }));
  document.querySelectorAll("[data-ticket]").forEach(b => b.addEventListener("click", () => {
    const t = DASH.tickets.find(x => x.id === b.getAttribute("data-ticket"));
    modal(`<div class="row" style="margin-bottom:12px"><b class="mono">${t.id}</b>${stChip(t.st)}</div><p style="font-size:14px"><b>${t.who}:</b> “${t.sub}. Please help — order was for my service shop.”</p>
    <textarea class="inp" rows="3" style="margin-top:14px" placeholder="Type a reply…"></textarea>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn btn-ghost btn-sm" onclick="closeOverlays();toast('Marked resolved ✅')">Resolve</button><button class="btn btn-p btn-sm" onclick="closeOverlays();toast('Reply sent to customer 📨')">Send reply</button></div>`, { title: "Ticket " + t.id });
  }));
  const oq = document.getElementById("ord-q"), os = document.getElementById("ord-st");
  const filt = () => {
    const q = (oq.value || "").toLowerCase(), s = os.value;
    document.getElementById("ord-tbl").innerHTML = ordersTable(DASH.orders.filter(o => (!q || (o.id + o.who + o.p.short).toLowerCase().includes(q)) && (!s || o.st === s)));
  };
  oq && oq.addEventListener("input", U.debounce(filt, 200)); os && os.addEventListener("change", filt);
  const nc = document.getElementById("new-coupon");
  nc && nc.addEventListener("click", () => modal(`<div class="form-grid"><div class="fld"><label>Code</label><input class="inp" placeholder="DIWALI20" id="nc-code"></div><div class="fld"><label>Discount %</label><input class="inp" type="number" value="20"></div><div class="fld"><label>Min order (₹)</label><input class="inp" type="number" value="999"></div><div class="fld"><label>Usage cap</label><input class="inp" type="number" value="5000"></div></div><button class="btn btn-p btn-block" style="margin-top:14px" onclick="closeOverlays();toast('Coupon created (demo) 🎟️')">Create coupon</button>`, { title: "New coupon" }));
  document.querySelectorAll("[data-coupon-toggle]").forEach(b => b.addEventListener("click", () => {
    const c = DASH.coupons.find(x => x.code === b.getAttribute("data-coupon-toggle"));
    c.st = c.st === "Active" ? "Paused" : "Active"; toast(`${c.code} ${c.st.toLowerCase()}`); Router.go();
  }));
}

/* ================= BOOT ================= */
(async function init(){
  document.documentElement.dataset.theme = "light";
  // pull the live catalogue from the backend, then compile the product database
  if (typeof loadCatalog === "function"){ await loadCatalog(); }
  buildDB();
  const boot = () => {
    try { const lk = document.querySelector('link[rel="icon"]'); if (lk && typeof BRAND_MARK === "string") lk.href = BRAND_MARK; } catch(e){}
    renderShell(); bindGlobal(); Router.go(); revealInit(document);
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
